   12.5 备注 / 标签弹窗
   ===================================================================== */
let modalMode = null, modalTarget = null;

function openModal(mode, id){
  const n = findNode(id);
  if(!n) return;
  modalMode = mode;
  modalTarget = id;
  hideMenu();

  const t = $('#modalTitle'), sub = $('#modalSub'), inp = $('#modalInput');
  if(mode === 'note'){
    t.textContent = '备注';
    sub.textContent = '⌘↵ 保存 · Esc 取消';
    inp.value = n.note || '';
    inp.placeholder = '写点什么…';
    inp.style.minHeight = '150px';
  }else{
    t.textContent = '标签';
    sub.textContent = '用逗号分隔，最多 8 个';
    inp.value = (n.labels || []).join('，');
    inp.placeholder = '例如：重点客户，Q4，待跟进';
    inp.style.minHeight = '72px';
  }
  $('#modalDel').style.display = 'inline-block';
  $('#modal').classList.add('on');
  setTimeout(() => { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }, 40);
}

function closeModal(){
  $('#modal').classList.remove('on');
  modalMode = null; modalTarget = null;
}

function saveModal(){
  const n = findNode(modalTarget);
  if(!n){ closeModal(); return; }
  const v = $('#modalInput').value;
  pushUndo();
  if(modalMode === 'note'){
    n.note = v.trim();
  }else{
    n.labels = v.split(/[,，;；\n]/).map(x => x.trim()).filter(Boolean).slice(0, 8);
  }
  touch();
  render();
  closeModal();
  toast(modalMode === 'note' ? '备注已保存' : '标签已更新');
}

function clearModal(){
  const n = findNode(modalTarget);
  if(!n){ closeModal(); return; }
  pushUndo();
  if(modalMode === 'note') n.note = '';
  else n.labels = [];
  touch();
  render();
  closeModal();
  toast('已清除');
}

$('#modalOk').onclick = saveModal;
$('#modalCancel').onclick = closeModal;
$('#modalDel').onclick = clearModal;
$('#modal').addEventListener('pointerdown', (e) => {
  if(e.target === $('#modal')) closeModal();
});

/* =====================================================================
   13. 键盘
   ===================================================================== */
window.addEventListener('keydown', (e) => {
  const mod = e.metaKey || e.ctrlKey;

  if($('#modal').classList.contains('on')){
    if(e.key === 'Escape'){ e.preventDefault(); closeModal(); return; }
    if(e.key === 'Enter' && mod){ e.preventDefault(); saveModal(); return; }
    return;
  }

  const titleFocused = document.activeElement === $('#docTitle');

  if(mod && e.key.toLowerCase() === 's'){ e.preventDefault(); actSave(); return; }
  if(mod && e.key.toLowerCase() === 'o'){ e.preventDefault(); actOpen(); return; }
  if(mod && e.key.toLowerCase() === 'n'){ e.preventDefault(); newDoc(true); return; }
  if(mod && e.key.toLowerCase() === 'e'){ e.preventDefault(); actExportPNG(); return; }
  if(mod && e.key.toLowerCase() === 'f'){ e.preventDefault(); openFind(); return; }
  if(mod && e.shiftKey && e.key.toLowerCase() === 'o'){ e.preventDefault(); toggleOutline(); return; }
  if(mod && e.shiftKey && e.key.toLowerCase() === 'z'){ e.preventDefault(); redo(); return; }
  if(mod && e.key.toLowerCase() === 'z'){ e.preventDefault(); undo(); return; }
  if(mod && (e.key === '0' || e.key === ')')){ e.preventDefault(); fitView(true); return; }
  if(mod && (e.key === '=' || e.key === '+')){ e.preventDefault(); zoomAt(1.15); return; }
  if(mod && e.key === '-'){ e.preventDefault(); zoomAt(1/1.15); return; }

  if(titleFocused){
    if(e.key === 'Enter' || e.key === 'Escape') $('#docTitle').blur();
    return;
  }

  /* --- 大纲内 --- */
  const inOutline = document.activeElement && document.activeElement.closest &&
                     document.activeElement.closest('#outline');
  if(inOutline){
    const txt = document.activeElement.classList.contains('ol-txt') ? document.activeElement : null;
    const id = txt ? txt.dataset.txt : (S.sel || S.doc.root.id);
    if(e.key === 'Escape'){ if(txt) txt.blur(); return; }
    if(e.key === 'Tab'){
      e.preventDefault();
      if(txt) olCommit(id, txt);
      e.shiftKey ? olOutdent(id) : olIndent(id);
      return;
    }
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      if(txt) olCommit(id, txt);
      addSibling(id);
      setTimeout(() => { const n = S.sel; if(n) setTimeout(() => olStartEdit(n), 60); }, 80);
      return;
    }
    if((e.key === 'Backspace' || e.key === 'Delete') && txt){
      const empty = !txt.textContent.trim();
      if(empty && id !== S.doc.root.id){
        e.preventDefault();
        txt.blur();
        deleteNode(id);
      }
      return;
    }
    if(e.key === 'ArrowUp' || e.key === 'ArrowDown'){
      e.preventDefault();
      navigate(e.key === 'ArrowUp' ? 'up' : 'down');
      const rows = flattenTree();
      const i = rows.findIndex(r => r.n.id === S.sel);
      const rowEl = olBody.children[i];
      if(rowEl) rowEl.scrollIntoView({ block: 'nearest' });
      return;
    }
    return;
  }
  if(mod) return;

  /* --- 编辑态 --- */
  if(S.editing){
    if(e.key === 'Escape'){ e.preventDefault(); cancelEdit(); return; }
    if(e.isComposing) return;
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      const id = S.editing.id;
      if(isEditingBlank()){
        const p = findParent(id) || findNode(id);
        cancelEdit();
        if(p) addSibling(p.id === S.doc.root.id ? S.doc.root.id : p.id);
        return;
      }
      commitEdit();
      addSibling(id);          // 与 XMind 一致：回车接着写下一个同级
      return;
    }
    if(e.key === 'Tab'){
      e.preventDefault();
      const id = S.editing.id;
      if(isEditingBlank()){ cancelEdit(); addChild(id); return; }
      commitEdit();
      addChild(id);
      return;
    }
    return;
  }

  /* --- 非编辑态 --- */
  if(e.key === 'Tab'){ e.preventDefault(); addChild(S.sel || S.doc.root.id); return; }
  if(e.key === 'Enter'){ e.preventDefault(); addSibling(S.sel || S.doc.root.id); return; }
  if(e.key === 'F2'){ if(S.sel){ e.preventDefault(); startEdit(S.sel); } return; }
  if(e.key === 'Delete' || e.key === 'Backspace'){
    if(S.sel){ e.preventDefault(); deleteNode(S.sel); }
    return;
  }
  if(e.key === 'ArrowUp'){ e.preventDefault(); navigate('up'); return; }
  if(e.key === 'ArrowDown'){ e.preventDefault(); navigate('down'); return; }
  if(e.key === 'ArrowLeft'){ e.preventDefault(); navigate('left'); return; }
  if(e.key === 'ArrowRight'){ e.preventDefault(); navigate('right'); return; }
  if(e.key === 'Escape'){ S.sel = null; render(); return; }
});

/* =====================================================================
   14. 原生桥 / 文件存取
   ===================================================================== */
const NATIVE = !!(window.webkit && window.webkit.messageHandlers &&
                  window.webkit.messageHandlers.mmSave);
function nativeCall(name, payload){
  if(!NATIVE) return false;
  try{ window.webkit.messageHandlers[name].postMessage(payload); return true; }
  catch(err){ return false; }
}

function actSave(){
  commitEdit();
  persist();
  const name = (S.doc.title || '未命名导图').replace(/[\\/:*?"<>|]/g, '-');
  if(nativeCall('mmSave', { json: serialize(), name })) return;
  // 浏览器回退
  downloadBlob(serialize(), name + '.mind.json', 'application/json');
  markSaved(name + '.mind.json');
}

function actOpen(){
  commitEdit();
  if(nativeCall('mmOpen', {})) return;
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if(!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      try{
        const obj = JSON.parse(String(fr.result));
        loadDoc(obj);
      }catch(err){ toast('文件格式无法识别'); }
    };
    fr.readAsText(f);
  };
  inp.click();
}

function markSaved(filename){
  S.dirty = false;
  $('#dirty').classList.remove('on');
  const d = new Date();
  $('#stSaved').textContent = '已保存 · ' + String(d.getHours()).padStart(2,'0') + ':' +
                              String(d.getMinutes()).padStart(2,'0');
  toast('已保存 ' + filename);
}

/* 原生回调入口 */
window.MM_receive = function(payload){
  try{
    const p = typeof payload === 'string' ? JSON.parse(payload) : payload;
    if(p.type === 'opened'){
      loadDoc(p.doc);
      if(p.name) $('#docTitle').value = p.doc.title || p.name.replace(/\.json$/i,'');
      return;
    }
    if(p.type === 'saved'){ markSaved(p.name || ''); return; }
    if(p.type === 'error'){ toast(p.message || '操作失败'); return; }
    if(p.type === 'toast'){ toast(p.message || ''); return; }
    if(p.type === 'pngReady'){ return; }
  }catch(err){ console.warn(err); }
};

function downloadBlob(text, filename, mime){
  const blob = new Blob([text], { type: mime || 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

/* 拖文件进窗口 */
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => {
  if(e.target.closest('#stage')) e.preventDefault();
}, true);

window.addEventListener('dragover', (e) => { e.preventDefault(); });
window.addEventListener('drop', (e) => {
  e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(!f) return;
  if(!/\.json$/i.test(f.name)){ toast('只支持 .json 导图文件'); return; }
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const obj = JSON.parse(String(fr.result));
      if(!obj || !obj.root) throw 0;
      loadDoc(obj);
    }catch(err){ toast('文件格式无法识别'); }
  };
  fr.readAsText(f);
});

/* =====================================================================
   15. PNG 导出
   ===================================================================== */
function themeBg(){
  const css = getComputedStyle(document.body);
  return css.backgroundColor || '#ffffff';
}

function roundRect(ctx, x, y, w, h, r){
  if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function wrapText(ctx, text, maxW){
  const lines = [];
  const paras = String(text).split('\n');
  for(const para of paras){
    if(!para){ lines.push(''); continue; }
    // 先按中文/英文混排切分
    const tokens = para.match(/[A-Za-z0-9@#&%$._'’\-+]+|\s+|[\u4e00-\u9fa5\u3000-\u303f]|./gu) || [para];
    let cur = '';
    for(const tk of tokens){
      const test = cur + tk;
      if(ctx.measureText(test).width > maxW && cur){
        lines.push(cur.replace(/\s+$/, ''));
        cur = /^\s+$/.test(tk) ? '' : tk;
      }else{
        cur = test;
      }
    }
    if(cur.trim() || !lines.length) lines.push(cur.replace(/\s+$/, ''));
  }
  return lines.length ? lines : [''];
}

function buildCanvas(scale){
  const metas = [];
  for(const [id, m] of S.meta){
    const n = findNode(id);
    if(!n) continue;
    const el = document.querySelector('.node[data-id="' + id + '"]');
    if(!el) continue;
    metas.push({ id, n, m });
  }
  if(!metas.length) return null;

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  metas.forEach(({ m }) => {
    minX = Math.min(minX, m.x); minY = Math.min(minY, m.y);
    maxX = Math.max(maxX, m.x + m.w); maxY = Math.max(maxY, m.y + m.h);
  });
  const pad = 46;
  const W = (maxX - minX) + pad * 2;
  const H = (maxY - minY) + pad * 2;

  const cv = document.createElement('canvas');
  cv.width = Math.round(W * scale);
  cv.height = Math.round(H * scale);
  const ctx = cv.getContext('2d');
  ctx.scale(scale, scale);

  // 背景
  const bg = themeBg();
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const ox = -minX + pad, oy = -minY + pad;
  const dark = S.theme === 'dark';
  const pal = PAL[S.theme] || PAL.paper;

  // 连线
  for(const { n, m } of metas){
    if(!n.children.length || n.collapsed) continue;
    for(const c of n.children){
      const cm = S.meta.get(c.id);
      if(!cm) continue;
      const leftward = cm.x + cm.w / 2 < m.x + m.w / 2;
      const x1 = (leftward ? m.x : m.x + m.w) + ox;
      const x2 = (leftward ? cm.x + cm.w : cm.x) + ox;
      const y1 = m.cy + oy;
      const y2 = cm.cy + oy;
      const dx = Math.max(18, Math.abs(x2 - x1) * 0.44);
      const dir = leftward ? -1 : 1;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.bezierCurveTo(x1 + dx*dir, y1, x2 - dx*dir, y2, x2, y2);
      ctx.strokeStyle = cm.color || m.color || '#999';
      ctx.globalAlpha = Math.max(0.34, 0.92 - (cm.depth || 1) * 0.10);
      ctx.lineWidth = cm.depth === 1 ? 2.4 : 1.7;
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // 节点
  for(const { id, n, m } of metas){
    const el = document.querySelector('.node[data-id="' + id + '"]');
    const isRoot = id === S.doc.root.id;
    const depth = m.depth || 0;
    const st = n.style || {};
    const x = m.x + ox, y = m.y + oy;

    let radius = isRoot ? 11 : 9;
    if(st.shape === 'square') radius = 2;
    else if(st.shape === 'pill') radius = Math.min(m.h / 2, 16);
    const noFill = (st.shape === 'underline' || st.shape === 'plain');

    if(noFill){
      if(st.shape === 'underline'){
        ctx.strokeStyle = st.color || n.color || (pal.cols[depth % pal.cols.length] || '#999');
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(x + 2, y + m.h - 2);
        ctx.lineTo(x + m.w - 2, y + m.h - 2);
        ctx.stroke();
      }
    }else if(isRoot){
      ctx.fillStyle = st.bg || n.color || (PAL[S.theme] || PAL.paper).root;
      ctx.shadowColor = 'rgba(0,0,0,.18)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 4;
      roundRect(ctx, x, y, m.w, m.h, radius); ctx.fill();
      ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    }else{
      ctx.fillStyle = st.bg || (dark ? '#25231f' : '#ffffff');
      ctx.shadowColor = dark ? 'rgba(0,0,0,.5)' : 'rgba(40,32,22,.10)';
      ctx.shadowBlur = 10; ctx.shadowOffsetY = 2;
      roundRect(ctx, x, y, m.w, m.h, radius); ctx.fill();
      ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
      if(!st.bg){
        ctx.strokeStyle = dark ? 'rgba(255,240,215,.13)' : 'rgba(60,50,40,.10)';
        ctx.lineWidth = 1; ctx.stroke();
      }
    }

    if(!el) continue;

    /* ---- 文字（按 DOM 实测位置绘制） ---- */
    const txtEl = el.querySelector('.txt');
    const fs = isRoot ? 15.5 : (depth === 1 ? 14 : 13.5);
    const cssFs = parseFloat(getComputedStyle(el).fontSize) || fs;
    const fontSize = st.fs ? ({ s:12, l:15.5, xl:18 }[st.fs] || fs) : cssFs;
    const weight = isRoot || depth === 1 ? 600 : 400;

    ctx.font = weight + ' ' + fontSize + 'px ' + FONT;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillStyle = st.color || (isRoot ? '#ffffff' : (dark ? '#ece7dd' : '#26221c'));

    const lineH = fontSize * 1.45;
    const tx = x + (txtEl ? txtEl.offsetLeft : (isRoot ? 20 : 13));
    const tyTop = y + (txtEl ? txtEl.offsetTop : (isRoot ? 11 : 8));
    const txW = txtEl ? txtEl.offsetWidth : (m.w - (isRoot ? 40 : 26));

    const lines = wrapText(ctx, n.text || '', txW + 1.5);
    const totalH = lines.length * lineH;
    let ly = tyTop + (txtEl ? txtEl.offsetHeight : totalH) / 2 - totalH / 2 + lineH / 2;
    for(const ln of lines){
      ctx.fillText(ln, tx, ly);
      ly += lineH;
    }

    /* ---- 标记 ---- */
    el.querySelectorAll('.mk').forEach(mkEl => {
      const mx = x + mkEl.offsetLeft, my = y + mkEl.offsetTop;
      const mw = mkEl.offsetWidth, mh = mkEl.offsetHeight;
      if(mkEl.classList.contains('pri')){
        const idx = parseInt(mkEl.textContent, 10) - 1;
        ctx.fillStyle = PRI_COLORS[idx] || '#888';
        roundRect(ctx, mx, my, mw, mh, 3.5); ctx.fill();
        ctx.fillStyle = isRoot ? '#fff' : '#ffffff';
        ctx.font = '800 9px "SF Mono",Menlo,monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(idx + 1), mx + mw / 2, my + mh / 2 + 0.5);
        ctx.textAlign = 'left';
      }else{
        ctx.font = '11.5px ' + FONT;
        ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
        ctx.fillText(mkEl.textContent, mx, my + mh / 2);
      }
    });

    /* ---- 标签 ---- */
    el.querySelectorAll('.lb').forEach(lbEl => {
      const lx = x + lbEl.offsetLeft, ly2 = y + lbEl.offsetTop;
      const lw = lbEl.offsetWidth, lh2 = lbEl.offsetHeight;
      const accent = n.color || '#c2543c';
      ctx.globalAlpha = 0.13;
      ctx.fillStyle = accent;
      roundRect(ctx, lx, ly2, lw, lh2, lh2 / 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = accent;
      ctx.globalAlpha = 0.25;
      ctx.lineWidth = 1; ctx.stroke();
      ctx.globalAlpha = 1;

      ctx.fillStyle = accent;
      ctx.font = '600 9.5px ' + FONT;
      ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
      ctx.fillText(lbEl.textContent, lx + 6, ly2 + lh2 / 2 + 0.5);
    });

    /* ---- 折叠徽标 ---- */
    if(n.children.length && n.collapsed){
      ctx.font = '700 9px "SF Mono",Menlo,monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = dark ? '#25231f' : '#ffffff';
      ctx.strokeStyle = dark ? 'rgba(255,240,215,.2)' : 'rgba(60,50,40,.18)';
      const bx = x + m.w - 8, by = y + 8;
      ctx.beginPath(); ctx.arc(bx, by, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = dark ? '#a49c8f' : '#6f665a';
      ctx.fillText('+' + n.children.length, bx, by + .5);
      ctx.textAlign = 'left';
    }
  }

  return cv;
}

function actExportPNG(){
  commitEdit();
  $('#veil').classList.add('on');
  setTimeout(() => {
    let cv = null;
    try{ cv = buildCanvas(2); }catch(err){ console.warn(err); }
    $('#veil').classList.remove('on');
    if(!cv){ toast('当前没有可导出的内容'); return; }
    const name = (S.doc.title || '思维导图').replace(/[\\/:*?"<>|]/g, '-') + '.png';
    let dataUrl;
    try{ dataUrl = cv.toDataURL('image/png'); }
    catch(err){ toast('画布过大，导出失败'); return; }
    if(nativeCall('mmSavePng', { base64: dataUrl.split(',')[1], name })) return;
    const a = document.createElement('a');
    a.href = dataUrl; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    toast('已导出 ' + name);
  }, 30);
}

/* =====================================================================
   17. 启动
   ===================================================================== */
function boot(){
  let doc = null, ui = null;
  try{ const raw = localStorage.getItem(M.LS_DOC); if(raw) doc = JSON.parse(raw); }catch(e){}
  try{ ui = JSON.parse(localStorage.getItem(M.LS_UI) || 'null'); }catch(e){}

  if(ui){
    if(THEMES.indexOf(ui.theme) >= 0) S.theme = ui.theme;
    if(ui.structure && STRUCT_NAME[ui.structure]) S.structure = ui.structure;
    else if(ui.layout === 'both') S.structure = 'logic-both';
    if(ui.outline) S.outlineOn = true;
  }
  document.body.dataset.theme = S.theme;

  S.doc = doc && doc.root ? sanitize(doc) : blankDoc();
  $('#docTitle').value = S.doc.title;
  syncTitle();
  render();

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      if(ui && typeof ui.scale === 'number'){
        S.scale = clamp(ui.scale, .18, 3.2);
        S.panX = ui.panX || 0; S.panY = ui.panY || 0;
        applyView();
      }else{
        fitView(false);
      }
      if(M.countNodes() === 1){
        S.sel = S.doc.root.id;
        render();
      }
    });
  });

  syncUndoUI();
  $('#stSaved').textContent = doc ? '已恢复上次编辑' : '新建导图';
}

window.addEventListener('beforeunload', () => { try{ persist(); }catch(e){} });

boot();

/* 供原生壳调用 */
window.MM = {
  save: actSave,
  open: actOpen,
  newDoc: () => newDoc(true),
  exportPng: actExportPNG,
  fit: () => fitView(true),
  setStructure: (id) => setStructure(id),
  openStyle: (id) => openStylePanel(id, 200, 200),
  openFind: () => openFind(),
  closeFind: () => closeFind(),
  find: (q) => { openFind(); findInput.value = q; runFind(false); },
  nextHit: () => stepHit(1),
  outline: (on) => toggleOutline(on),
  structures: () => STRUCTURES.map(x => x.id),
  zoomIn: () => zoomAt(1.15),
  zoomOut: () => zoomAt(1/1.15),
  load: (obj) => loadDoc(obj),
  handleUndo: () => {
    const ae = document.activeElement;
    if(ae && (ae.isContentEditable || ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')){
      try{ document.execCommand('undo'); }catch(e){}
      return;
    }
    undo();
  },
  handleRedo: () => {
    const ae = document.activeElement;
    if(ae && (ae.isContentEditable || ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')){
      try{ document.execCommand('redo'); }catch(e){}
      return;
    }
    redo();
  },
  onNativeReady: () => { /* 使用系统标题栏，无需自绘拖拽区 */ }
};

})();
</script>
</body>
</html>
