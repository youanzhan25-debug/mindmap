<title>思维导图</title>
<style>
:root{
  --bg:#f2f0ea;
  --bg-grid:rgba(90,80,65,.055);
  --surface:#fffdf9;
  --surface-2:#f8f5ef;
  --line:rgba(60,50,40,.10);
  --line-strong:rgba(60,50,40,.18);
  --text:#26221c;
  --text-2:#6f665a;
  --text-3:#a29a8d;
  --shadow:0 1px 2px rgba(40,32,22,.06),0 6px 18px -8px rgba(40,32,22,.18);
  --shadow-lg:0 2px 6px rgba(40,32,22,.07),0 18px 40px -18px rgba(40,32,22,.28);
  --accent:#c2543c;
  --sel:#c2543c;
  --ui-font:"Avenir Next","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
  --bar-h:46px;
  --status-h:28px;
}
body[data-theme="dark"]{
  --bg:#191815;
  --bg-grid:rgba(255,240,215,.045);
  --surface:#25231f;
  --surface-2:#1f1d1a;
  --line:rgba(255,240,215,.10);
  --line-strong:rgba(255,240,215,.20);
  --text:#ece7dd;
  --text-2:#a49c8f;
  --text-3:#6d665b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px -8px rgba(0,0,0,.5);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 18px 40px -18px rgba(0,0,0,.7);
  --accent:#e0715a;
  --sel:#e0715a;
}
body[data-theme="ink"]{
  --bg:#eceef0;
  --bg-grid:rgba(30,45,60,.06);
  --surface:#ffffff;
  --surface-2:#f2f4f6;
  --line:rgba(25,40,55,.10);
  --line-strong:rgba(25,40,55,.20);
  --text:#17202a;
  --text-2:#5b6976;
  --text-3:#93a0ac;
  --shadow:0 1px 2px rgba(20,35,50,.05),0 6px 18px -8px rgba(20,35,50,.16);
  --shadow-lg:0 2px 6px rgba(20,35,50,.06),0 18px 40px -18px rgba(20,35,50,.24);
  --accent:#2f6f9f;
  --sel:#2f6f9f;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:var(--ui-font);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  user-select:none;
  transition:background .22s ease,color .22s ease;
}
button{font-family:inherit;color:inherit}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ---------- top bar ---------- */
#bar{
  height:var(--bar-h);flex:0 0 var(--bar-h);
  display:flex;align-items:center;gap:10px;
  padding:0 12px 0 16px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  position:relative;z-index:30;
}
#bar.drag{-webkit-app-region:drag}
.no-drag{-webkit-app-region:no-drag}

#brand{
  display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--text-2);
  padding-right:12px;border-right:1px solid var(--line);
  white-space:nowrap;
}
#brand svg{width:17px;height:17px;color:var(--accent)}

#titleWrap{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
#docTitle{
  font-size:13.5px;font-weight:600;letter-spacing:.01em;
  padding:4px 8px;border-radius:6px;border:1px solid transparent;
  background:transparent;color:var(--text);
  max-width:46vw;min-width:60px;
  outline:none;
}
#docTitle:hover{background:var(--surface-2)}
#docTitle:focus{background:var(--surface-2);border-color:var(--line-strong)}
#dirty{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:0;transition:opacity .2s}
#dirty.on{opacity:.85}

#tools{display:flex;align-items:center;gap:2px}
.tbtn{
  height:30px;min-width:30px;padding:0 8px;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  border:1px solid transparent;border-radius:7px;background:transparent;
  color:var(--text-2);cursor:pointer;
  font-size:12.5px;font-weight:500;white-space:nowrap;
  transition:background .14s,color .14s,border-color .14s;
}
.tbtn svg{width:15px;height:15px;flex:none}
.tbtn:hover{background:var(--surface-2);color:var(--text)}
.tbtn:active{transform:translateY(.5px)}
.tbtn.on{background:var(--surface-2);color:var(--accent);border-color:var(--line)}
.tbtn[disabled]{opacity:.32;pointer-events:none}
.tsep{width:1px;height:18px;background:var(--line);margin:0 6px}
#zoomVal{
  font-family:var(--mono);font-size:11.5px;color:var(--text-2);
  min-width:44px;text-align:center;font-variant-numeric:tabular-nums;
}

/* ---------- main 双栏 ---------- */
#main{display:flex;flex:1;min-height:0;min-width:0}

/* ---------- find bar ---------- */
#findBar{
  position:absolute;top:12px;left:50%;transform:translateX(-50%) translateY(-12px);
  display:none;align-items:center;gap:4px;z-index:40;
  background:var(--surface);border:1px solid var(--line-strong);
  border-radius:9px;box-shadow:var(--shadow-lg);
  padding:5px 6px 5px 10px;
  opacity:0;transition:opacity .16s,transform .16s;
}
#findBar.on{display:flex;opacity:1;transform:translateX(-50%) translateY(0)}
#findBar svg{width:14px;height:14px;color:var(--text-3);flex:none}
#findInput{
  width:210px;border:0;background:transparent;outline:none;
  font-family:inherit;font-size:13px;color:var(--text);padding:3px 0;
}
#findInput::placeholder{color:var(--text-3)}
#findCount{
  font-family:var(--mono);font-size:11px;color:var(--text-3);
  min-width:46px;text-align:center;font-variant-numeric:tabular-nums;
}
#findBar .fb{
  width:22px;height:22px;border:0;background:transparent;border-radius:5px;
  color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;
}
#findBar .fb:hover{background:var(--surface-2);color:var(--text)}
#findBar .fb[disabled]{opacity:.3;pointer-events:none}

.node.hit{outline:2px solid #e3b23c;outline-offset:2px}
.node.hit.cur{outline-color:#e2711d;outline-width:3px;outline-offset:2px}
body[data-theme="dark"] .node.hit{outline-color:#d8a94a}

/* ---------- outline ---------- */
#outline{
  width:326px;flex:none;min-width:0;
  border-left:1px solid var(--line);
  background:var(--surface);
  display:none;flex-direction:column;
}
#outline.on{display:flex}
.ol-head{
  height:34px;flex:none;display:flex;align-items:center;gap:8px;
  padding:0 8px 0 14px;
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);
  border-bottom:1px solid var(--line);
}
.ol-head .cnt{font-weight:500;letter-spacing:0;text-transform:none}
.ol-head .x{
  margin-left:auto;width:22px;height:22px;border-radius:5px;border:0;background:transparent;
  color:var(--text-3);cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.ol-head .x:hover{background:var(--line);color:var(--text)}
.ol-body{
  flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 6px 40px;
  font-size:13px;line-height:1.5;
}
.ol-body::-webkit-scrollbar{width:8px}
.ol-body::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px}
.ol-row{
  display:flex;align-items:flex-start;gap:3px;
  padding:3px 6px 3px 0;border-radius:6px;cursor:pointer;
  position:relative;
}
.ol-row:hover{background:color-mix(in srgb,var(--text) 5%,transparent)}
.ol-row.sel{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.ol-row.sel .ol-txt{color:var(--accent);font-weight:600}
.ol-row.hit{background:color-mix(in srgb,#e8c33a 30%,transparent)}
.ol-tw{
  width:14px;height:19px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:9px;color:var(--text-3);cursor:pointer;border-radius:3px;margin-top:1px;
}
.ol-tw:hover{background:var(--line);color:var(--text)}
.ol-tw.leaf{visibility:hidden}
.ol-dot{
  width:5px;height:5px;border-radius:50%;flex:none;margin:8px 4px 0 1px;
  background:var(--bc,#bbb);
}
.ol-txt{
  flex:1;min-width:0;outline:none;padding:1px 2px;border-radius:4px;
  word-break:break-word;white-space:pre-wrap;
}
.ol-txt:focus{background:var(--surface);box-shadow:0 0 0 1.5px var(--accent)}
.ol-txt:empty::before{content:'空节点';color:var(--text-3)}
.ol-tags{display:flex;gap:3px;flex:none;margin-left:4px}
.ol-tags i{font-style:normal;font-size:9px;opacity:.75}

/* ---------- stage ---------- */
#stage{
  position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 1px 1px,var(--bg-grid) 1px,transparent 0);
  background-size:22px 22px;
  cursor:grab;
}
#stage.panning{cursor:grabbing}
#stage{touch-action:none;-webkit-user-select:none}
.node{touch-action:none}
#stage.dropping{box-shadow:inset 0 0 0 2px var(--accent)}

#world{
  position:absolute;left:0;top:0;transform-origin:0 0;
  will-change:transform;
}
#wires{position:absolute;overflow:visible;pointer-events:none}
.wire{fill:none;stroke-linecap:round;transition:stroke .2s}
.wire-hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke}

/* ---------- nodes ---------- */
#nodes{position:absolute;left:0;top:0}
.node{
  position:absolute;
  width:max-content;
  max-width:250px;
  border-radius:9px;
  background:var(--surface);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  padding:8px 13px;
  font-size:13.5px;line-height:1.45;
  letter-spacing:.005em;
  color:var(--text);
  cursor:default;
  transition:box-shadow .16s,border-color .16s,transform .1s;
  transform-origin:center;
  word-break:break-word;
  overflow-wrap:anywhere;
}
.node:hover{box-shadow:var(--shadow-lg);border-color:var(--line-strong)}
.node.sel{border-color:var(--sel);box-shadow:0 0 0 2.5px color-mix(in srgb,var(--sel) 26%,transparent),var(--shadow-lg)}
.node.editing{cursor:text;box-shadow:0 0 0 2.5px color-mix(in srgb,var(--sel) 40%,transparent),var(--shadow-lg)}
.node.editing:hover{transform:none}

.node.depth0{
  background:var(--nb,#c2543c);
  border-color:transparent;
  color:#fff;
  font-size:15.5px;font-weight:600;letter-spacing:.01em;
  padding:11px 20px;border-radius:11px;
  box-shadow:0 2px 8px -2px color-mix(in srgb,var(--nb,#c2543c) 55%,transparent),var(--shadow-lg);
}
.node.depth1{font-size:14px;font-weight:600;letter-spacing:.005em}

.node .txt{
  display:block;outline:none;min-width:14px;white-space:pre-wrap;
  user-select:text;
}
.node.editing .txt{user-select:text}
.node .txt:empty::before{
  content:"输入主题";
  color:var(--text-3);
  font-weight:400;
}
.node.depth0 .txt:empty::before{color:rgba(255,255,255,.6)}

/* collapse badge */
.kid{
  position:absolute;right:-8px;top:-8px;
  min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface);border:1px solid var(--line-strong);
  box-shadow:var(--shadow);
  font-family:var(--mono);font-size:9px;font-weight:700;
  color:var(--text-2);cursor:pointer;
  transition:opacity .16s,transform .16s,color .16s,border-color .16s,background .16s;
  z-index:3;
}
.kid.open{opacity:.55;transform:scale(.94)}
.node:hover .kid.open{opacity:1;transform:scale(1)}
.kid:hover{color:#fff;background:var(--accent);border-color:var(--accent);transform:scale(1.15)}
.node.side-l .kid{right:auto;left:-8px}

.node.droptar{
  border-color:var(--accent)!important;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent),var(--shadow-lg)!important;
}

/* ---------- popover ---------- */
.popover{
  position:fixed;z-index:210;min-width:176px;
  background:var(--surface);border:1px solid var(--line-strong);
  border-radius:10px;box-shadow:var(--shadow-lg);
  padding:5px;font-size:13px;display:none;
}
.popover.open{display:block;animation:pop .12s ease-out}
.pop-head{
  font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-3);padding:6px 9px 4px;
}
.pop-item{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:6px;cursor:pointer}
.pop-item:hover{background:var(--surface-2)}
.pop-item .nm{flex:1}
.pop-item .ht{font-size:10.5px;color:var(--text-3)}
.pop-item .ck{color:var(--accent);opacity:0;width:12px}
.pop-item.on .ck{opacity:1}
.pop-item.on .nm{color:var(--accent);font-weight:600}

/* ---------- context menu ---------- */
#menu{
  position:fixed;z-index:200;min-width:196px;
  max-height:calc(100vh - 28px);overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);border:1px solid var(--line-strong);
  border-radius:10px;box-shadow:var(--shadow-lg);
  padding:5px;font-size:13px;
  display:none;
}
#menu.open{display:block;animation:pop .12s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-3px)}to{opacity:1;transform:none}}
.mitem{
  display:flex;align-items:center;gap:9px;
  padding:6px 9px;border-radius:6px;cursor:pointer;
  color:var(--text);white-space:nowrap;
}
.mitem:hover{background:var(--surface-2)}
.mitem .k{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.mitem .ic{width:14px;height:14px;color:var(--text-2);flex:none;display:flex}
.mitem .ic svg{width:14px;height:14px}
.mdiv{height:1px;background:var(--line);margin:5px 4px}
.mswatches{display:flex;gap:6px;padding:7px 9px 4px}
.sw{width:15px;height:15px;border-radius:50%;cursor:pointer;border:1.5px solid transparent;transition:transform .12s}
.sw:hover{transform:scale(1.18)}
.sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--surface) inset}

/* ---------- status ---------- */
#status{
  height:var(--status-h);flex:0 0 var(--status-h);
  display:flex;align-items:center;gap:14px;
  padding:0 14px;
  background:var(--surface);
  border-top:1px solid var(--line);
  font-size:11px;color:var(--text-3);
  font-variant-numeric:tabular-nums;
}
#status .sp{margin-left:auto}
#status b{font-weight:600;color:var(--text-2)}
#status kbd{
  font-family:var(--mono);font-size:10px;padding:1px 4px;border-radius:3px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--text-2);
}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:52px;transform:translate(-50%,10px);
  background:var(--text);color:var(--bg);
  padding:7px 15px;border-radius:20px;
  font-size:12.5px;font-weight:500;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  z-index:300;box-shadow:var(--shadow-lg);
  max-width:70vw;
}
#toast.on{opacity:.95;transform:translate(-50%,0)}

/* ---------- empty tip ---------- */
#tip{
  position:absolute;left:50%;top:calc(50% + 90px);transform:translateX(-50%);
  font-size:12px;color:var(--text-3);text-align:center;line-height:1.9;
  pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .3s;
}
#tip.on{opacity:1}
#tip kbd{
  font-family:var(--mono);font-size:10.5px;padding:1.5px 5px;border-radius:4px;
  background:var(--surface);border:1px solid var(--line-strong);color:var(--text-2);
}

/* ---------- export overlay ---------- */
#veil{
  position:fixed;inset:0;background:var(--bg);z-index:400;
  display:none;align-items:center;justify-content:center;
  font-size:13px;color:var(--text-2);flex-direction:column;gap:14px;
}
#veil.on{display:flex}
.spin{
  width:26px;height:26px;border-radius:50%;
  border:2px solid var(--line-strong);border-top-color:var(--accent);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width: 760px){
  :root{--bar-h:50px;--status-h:24px}
  #bar{padding:0 8px 0 10px;gap:6px;padding-top:env(safe-area-inset-top)}
  #status{padding-bottom:env(safe-area-inset-bottom)}
  #brand{padding-right:8px}
  #brand span{display:none}
  #docTitle{max-width:36vw;font-size:12.5px;padding:3px 6px}
  #tools{gap:0}
  .tbtn{min-width:36px;height:36px;padding:0 6px;border-radius:8px}
  .tbtn svg{width:17px;height:17px}
  .tsep{margin:0 2px;height:16px}
  #zoomVal{min-width:34px;font-size:10.5px}
  #btnUndo, #btnRedo, #btnZoomIn, #btnZoomOut, #zoomVal, #bar .tsep{display:none!important}

  #outline{
    position:fixed;inset:0;width:auto;z-index:120;border-left:0;
    background:var(--surface);
  }
  #outline.on{display:flex}
  .ol-head{height:44px;padding:0 10px 0 16px;font-size:12px}
  .ol-head .x{width:30px;height:30px}
  .ol-body{font-size:15px;padding:10px 8px 80px}
  .ol-row{padding-top:6px;padding-bottom:6px}
  .ol-tw{width:18px;height:22px;font-size:11px}

  .node{font-size:14px;max-width:190px;padding:9px 13px;border-radius:10px}
  .node.depth0{font-size:16px;padding:12px 18px}
  .node.depth1{font-size:14.5px}
  .kid{min-width:20px;height:20px;font-size:10px;right:-9px;top:-9px}

  #status{font-size:10px;gap:10px;padding:0 10px}
  #status .hide-sm{display:none}
  #tip{display:none}

  #findBar{left:10px;right:10px;transform:translateY(-12px)}
  #findBar.on{transform:translateY(0)}
  #findInput{flex:1;width:auto;font-size:15px}
  #findCount{min-width:40px}

  .popover{max-width:calc(100vw - 20px)}
  .mk-grid{grid-template-columns:repeat(6,1fr);gap:5px}
  .mk-cell{height:34px;font-size:15px}
  .mitem{padding:9px 10px}
  .modal-bd textarea{min-height:120px;font-size:15px}
}
</style>
</head>

  <header id="bar">
    <div id="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">

  <main id="main">

        <input id="findInput" placeholder="搜索节点、标签、备注" spellcheck="false">

<script>
"use strict";
(function(){

/* =====================================================================
   0. 常量 & 工具
   ===================================================================== */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

const FONT = '"Avenir Next","PingFang SC","Hiragino Sans GB",system-ui,sans-serif';

const HG = 58;          // 层间水平间距
const VG = 17;          // 兄弟节点垂直间距
const PAD = 90;         // 画布留白

const PAL = {
  paper:{ cols:['#c2543c','#41705e','#3d5a80','#ad7b2c','#7c5e91','#2c7d7d'], root:'#b8452d' },
  dark :{ cols:['#e0715a','#5c9c84','#6a8cbe','#d2a04a','#a583bd','#4fa8a8'], root:'#d0523a' },
  ink  :{ cols:['#2f6f9f','#3f7f6a','#a8603c','#8a6bab','#4f7d3f','#b0466a'], root:'#275f89' }
};
const THEMES = ['paper','ink','dark'];

const PRI_COLORS = ['#d64545','#e07b39','#e3a82b','#bfae2c','#5f9e5f','#4a90b8','#8a8a8a'];
const MARKERS = [
  { id:'pri-1', kind:'pri', v:1, name:'优先级 1' },
  { id:'pri-2', kind:'pri', v:2, name:'优先级 2' },
  { id:'pri-3', kind:'pri', v:3, name:'优先级 3' },
  { id:'pri-4', kind:'pri', v:4, name:'优先级 4' },
  { id:'pri-5', kind:'pri', v:5, name:'优先级 5' },
  { id:'pri-6', kind:'pri', v:6, name:'优先级 6' },
  { id:'pri-7', kind:'pri', v:7, name:'优先级 7' },
  { id:'star',     kind:'emo', ch:'\u2b50', name:'星标' },
  { id:'flag',     kind:'emo', ch:'\u2691\ufe0f', name:'旗标' },
  { id:'done',     kind:'emo', ch:'\u2705', name:'已完成' },
  { id:'doing',    kind:'emo', ch:'\u23f3', name:'进行中' },
  { id:'todo',     kind:'emo', ch:'\u2b1c', name:'待办' },
  { id:'question', kind:'emo', ch:'\u2753', name:'疑问' },
  { id:'warn',     kind:'emo', ch:'\u26a0\ufe0f', name:'注意' },
  { id:'idea',     kind:'emo', ch:'\u{1f4a1}', name:'想法' },
  { id:'heart',    kind:'emo', ch:'\u2764\ufe0f', name:'重要' },
  { id:'pin',      kind:'emo', ch:'\u{1f4cc}', name:'关键' },
  { id:'person',   kind:'emo', ch:'\u{1f464}', name:'负责人' }
];
const MARKER_MAP = {};
MARKERS.forEach(m => { MARKER_MAP[m.id] = m; });

const escHTML = t => String(t).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let idc = 0;
const uid = () => 'n' + Date.now().toString(36) + (idc++).toString(36) + Math.random().toString(36).slice(2,5);
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const clone = o => JSON.parse(JSON.stringify(o));

/* =====================================================================
   1. 状态
   ===================================================================== */
const S = {
  doc: null,
  sel: null,
  editing: null,     // { id, isNew }
  scale: 1, panX: 0, panY: 0,
  structure: 'logic-right',
  theme: 'paper',
  undo: [], redo: [],
  dirty: false,
  outlineOn: false,
  outlineFilter: '',
  meta: new Map(),   // id -> {el, w, h, x, y, cy, color, depth, side, parent}
  savedAt: 0
};

const LS_DOC = 'mindmap.doc.v1';
const LS_UI  = 'mindmap.ui.v1';

/* =====================================================================
   2. 文档模型
   ===================================================================== */
function blankDoc(){
  return {
    app:'MindMap', version:2, title:'未命名导图',
    structure:'logic-right',
    updatedAt:new Date().toISOString(),
    root:{ id:uid(), text:'中心主题', color:null, collapsed:false, side:'r', children:[] }
  };
}

function findNode(id, node){
  node = node || S.doc.root;
  if(node.id === id) return node;
  for(const c of node.children){
    const r = findNode(id, c);
    if(r) return r;
  }
  return null;
}
function findParent(id, node, parent){
  node = node || S.doc.root; parent = parent || null;
  if(node.id === id) return parent;
  for(const c of node.children){
    const r = findParent(id, c, node);
    if(r) return r;
  }
  return null;
}
const allNodes = (root) => {
  const out = [];
  (function w(n){ out.push(n); n.children.forEach(w); })(root || S.doc.root);
  return out;
};
const countNodes = () => allNodes().length;
const maxDepth = () => {
  let d = 0;
  (function w(n, k){ d = Math.max(d, k); n.children.forEach(c => w(c, k+1)); })(S.doc.root, 1);
  return d;
};

/* 撤销栈 */
function pushUndo(){
  S.undo.push(JSON.stringify(S.doc));
  if(S.undo.length > 80) S.undo.shift();
  S.redo.length = 0;
  syncUndoUI();
}
function undo(){
  if(!S.undo.length) return;
  S.redo.push(JSON.stringify(S.doc));
  S.doc = JSON.parse(S.undo.pop());
  S.sel = null; S.editing = null;
  touch(false); render(); syncUndoUI();
}
function redo(){
  if(!S.redo.length) return;
  S.undo.push(JSON.stringify(S.doc));
  S.doc = JSON.parse(S.redo.pop());
  S.sel = null; S.editing = null;
  touch(false); render(); syncUndoUI();
}
function syncUndoUI(){
  $('#btnUndo').disabled = !S.undo.length;
  $('#btnRedo').disabled = !S.redo.length;
}

/* =====================================================================
   3. 变更入口
   ===================================================================== */
let persistTimer = null;
function touch(markDirty){
  if(markDirty !== false){
    S.dirty = true;
    $('#dirty').classList.add('on');
  }
  S.doc.updatedAt = new Date().toISOString();
  clearTimeout(persistTimer);
  persistTimer = setTimeout(persist, 420);
}
function persist(){
  try{
    localStorage.setItem(LS_DOC,
      JSON.stringify(S.doc, (k, v) => (k.charAt(0) === '_' ? undefined : v)));
    localStorage.setItem(LS_UI, JSON.stringify({
      theme:S.theme, structure:S.structure, scale:S.scale, panX:S.panX, panY:S.panY
    }));
    S.dirty = false;
    $('#dirty').classList.remove('on');
    const d = new Date();
    if(!S.dirty && $('#stSaved').textContent.indexOf('已保存') === 0) return;
    $('#stSaved').textContent = '草稿已存 ' +
      String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }catch(e){ /* 存储不可用时静默降级 */ }
}

/* =====================================================================
   4. 布局引擎（多版式）
   ===================================================================== */
const STRUCTURES = [
  { id:'logic-right', name:'逻辑图',   hint:'向右展开' },
  { id:'logic-both',  name:'双侧逻辑', hint:'左右分支' },
  { id:'mindmap',     name:'思维导图', hint:'中心辐射' },
  { id:'tree',        name:'树状图',   hint:'自上而下' },
  { id:'org',         name:'组织架构', hint:'肘形连线' },
  { id:'timeline',    name:'时间轴',   hint:'沿轴排列' }
];
const STRUCT_NAME = {};
STRUCTURES.forEach(x => { STRUCT_NAME[x.id] = x.name; });

const VGD = 62;    // 纵向布局的层间距
const AXIS = 36;   // 时间轴距中轴的距离

function branchColor(node, index){
  const pal = (PAL[S.theme] || PAL.paper).cols;
  if(node.color) return node.color;
  return pal[index % pal.length];
}

/** 子树占用的垂直高度（横向布局用） */
function subH(node, cache){
  if(cache.has(node.id)) return cache.get(node.id);
  const m = S.meta.get(node.id);
  let h = m ? m.h : 34;
  if(!node.collapsed && node.children.length){
    let acc = 0;
    node.children.forEach((c,i) => { acc += subH(c, cache) + (i ? VG : 0); });
    h = Math.max(h, acc);
  }
  cache.set(node.id, h);
  return h;
}

/** 子树占用的水平宽度（纵向布局用） */
function subW(node, cache){
  if(cache.has(node.id)) return cache.get(node.id);
  const m = S.meta.get(node.id);
  let w = m ? m.w : 90;
  if(!node.collapsed && node.children.length){
    let acc = 0;
    node.children.forEach((c,i) => { acc += subW(c, cache) + (i ? HG : 0); });
    w = Math.max(w, acc);
  }
  cache.set(node.id, w);
  return w;
}

/** 某一侧每一层的最大节点宽度 */
function maxWidthByDepth(kids){
  const m = new Map();
  const walk = (n, d) => {
    const meta = S.meta.get(n.id);
    if(meta) m.set(d, Math.max(m.get(d) || 0, meta.w));
    if(!n.collapsed) n.children.forEach(c => walk(c, d + 1));
  };
  kids.forEach(k => walk(k, 1));
  return m;
}

/* ---------- A. 横向布局：逻辑图 / 思维导图 ---------- */

function placeSide(kids, dir, rootMeta){
  if(!kids.length) return;

  const maxW = maxWidthByDepth(kids);
  const maxD = Math.max(...Array.from(maxW.keys()));
  const levelEdge = new Map();

  if(dir === 1){
    levelEdge.set(1, rootMeta.x + rootMeta.w + HG);
    for(let d = 2; d <= maxD; d++){
      levelEdge.set(d, levelEdge.get(d-1) + (maxW.get(d-1) || 0) + HG);
    }
  }else{
    levelEdge.set(1, rootMeta.x - HG);
    for(let d = 2; d <= maxD; d++){
      levelEdge.set(d, levelEdge.get(d-1) - (maxW.get(d-1) || 0) - HG);
    }
  }

  const cache = new Map();
  const heights = kids.map(k => subH(k, cache));
  const total = heights.reduce((a,b) => a + b, 0) + VG * (kids.length - 1);
  let cursor = -total / 2;

  kids.forEach((k, i) => {
    placeNode(k, cursor, 1, dir, levelEdge);
    cursor += heights[i] + VG;
  });
}

function placeNode(node, top, depth, dir, levelEdge){
  const meta = S.meta.get(node.id);
  if(!meta) return;
  const cache = new Map();
  const th = subH(node, cache);
  const cy = top + th / 2;

  meta.depth = depth;
  meta.side  = dir === 1 ? 'r' : 'l';
  meta.cy    = cy;
  meta.y     = cy - meta.h / 2;

  const edge = levelEdge.get(depth);
  meta.x = dir === 1 ? edge : edge - meta.w;

  if(depth === 1){
    meta.color = branchColor(node, node._branchIndex || 0);
  }else{
    const p = S.meta.get(findParent(node.id).id);
    meta.color = node.color || (p ? p.color : '#999');
  }

  if(node.collapsed || !node.children.length) return;

  let childTotal = 0;
  node.children.forEach((c,i) => { childTotal += subH(c, cache) + (i ? VG : 0); });
  let cur = top + (th - childTotal) / 2;
  node.children.forEach(c => {
    placeNode(c, cur, depth + 1, dir, levelEdge);
    cur += subH(c, cache) + VG;
  });
}

function layoutSideways(root, both){
  const grand = root.children;
  if(both){
    const anyLeft = grand.some(c => c.side === 'l');
    if(!anyLeft) grand.forEach((c,i) => { c.side = i % 2 === 0 ? 'r' : 'l'; });
  }else{
    grand.forEach(c => { c.side = 'r'; });
  }
  const rootMeta = S.meta.get(root.id);
  placeSide(grand.filter(c => c.side !== 'l'), 1, rootMeta);
  placeSide(grand.filter(c => c.side === 'l'), -1, rootMeta);
}

/* ---------- B. 纵向布局：树状图 / 组织架构 ---------- */

function layoutDownward(root){
  const levelH = [];
  (function scan(n, d){
    const m = S.meta.get(n.id);
    if(!m) return;
    levelH[d] = Math.max(levelH[d] || 0, m.h);
    if(!n.collapsed) n.children.forEach(c => scan(c, d + 1));
  })(root, 0);

  const levelY = [0];
  for(let d = 1; d < levelH.length; d++){
    levelY[d] = levelY[d-1] + levelH[d-1] + VGD;
  }

  const cache = new Map();
  const rootColor = root.color || (PAL[S.theme] || PAL.paper).root;

  function place(n, left, depth){
    const m = S.meta.get(n.id);
    if(!m) return;
    const width = subW(n, cache);
    m.x = left + (width - m.w) / 2;
    m.y = levelY[depth] || 0;
    m.cy = m.y + m.h / 2;
    m.depth = depth;
    m.side = 'd';
    if(depth === 0) m.color = rootColor;
    else if(depth === 1) m.color = branchColor(n, n._branchIndex || 0);
    else {
      const p = S.meta.get(findParent(n.id).id);
      m.color = n.color || (p ? p.color : '#999');
    }
    if(n.collapsed || !n.children.length) return;
    let cursor = left;
    n.children.forEach(c => {
      place(c, cursor, depth + 1);
      cursor += subW(c, cache) + HG;
    });
  }

  const totalW = subW(root, cache);
  place(root, 0, 0);

  const rm = S.meta.get(root.id);
  const shift = -(rm.x + rm.w / 2);
  S.meta.forEach(m => { m.x += shift; });
}

/* ---------- C. 时间轴 ---------- */

function layoutTimeline(root){
  const kids = root.children;
  const cache = new Map();
  const rm = S.meta.get(root.id);
  rm.x = 0; rm.y = -rm.h / 2; rm.cy = 0; rm.depth = 0; rm.side = 'r';
  rm.color = root.color || (PAL[S.theme] || PAL.paper).root;

  const hUp = [], hDn = [];
  kids.forEach((k, i) => {
    const up = i % 2 === 0;
    (function scan(n, d){
      const m = S.meta.get(n.id);
      if(!m) return;
      const arr = up ? hUp : hDn;
      arr[d] = Math.max(arr[d] || 0, m.h);
      if(!n.collapsed) n.children.forEach(c => scan(c, d + 1));
    })(k, 1);
  });

  function levelAccs(up){
    const arr = up ? hUp : hDn;
    const accs = [];
    let acc = AXIS;
    for(let d = 1; d < arr.length; d++){
      accs[d] = acc;
      acc += (arr[d] || 0) + VGD;
    }
    return accs;
  }
  const accUp = levelAccs(true), accDn = levelAccs(false);

  const widths = kids.map(k => subW(k, cache));
  let cursor = rm.x + rm.w + 72;

  kids.forEach((k, i) => {
    const up = i % 2 === 0;
    placeTL(k, cursor, 1, up ? accUp : accDn, up, i);
    cursor += widths[i] + 46;
  });

  function placeTL(n, left, depth, accs, up, bi){
    const m = S.meta.get(n.id);
    if(!m) return;
    const w = subW(n, cache);
    m.x = left + (w - m.w) / 2;
    const base = (accs[depth] !== undefined) ? accs[depth] : AXIS;
    m.y = up ? -(base + m.h) : base;
    m.cy = m.y + m.h / 2;
    m.depth = depth;
    m.side = up ? 'u' : 'd';
    if(depth === 1){
      m.color = branchColor(n, bi);
    }else{
      const p = S.meta.get(findParent(n.id).id);
      m.color = n.color || (p ? p.color : '#999');
    }
    if(n.collapsed || !n.children.length) return;
    let cur = left;
    n.children.forEach(c => {
      placeTL(c, cur, depth + 1, accs, up, bi);
      cur += subW(c, cache) + HG;
    });
  }
}

/* ---------- 统一入口 ---------- */

function layoutAll(root){
  const rm0 = S.meta.get(root.id);
  if(rm0){ rm0.x = -rm0.w / 2; rm0.y = -rm0.h / 2; rm0.cy = 0; }
  const st = S.structure;
  if(st === 'tree' || st === 'org') layoutDownward(root);
  else if(st === 'timeline') layoutTimeline(root);
  else layoutSideways(root, st === 'logic-both' || st === 'mindmap');
}

/* =====================================================================
   5. 渲染
   ===================================================================== */
let renderRaf = null;

function render(){
  if(renderRaf) cancelAnimationFrame(renderRaf);
  renderRaf = requestAnimationFrame(doRender);
}

function doRender(){
  renderRaf = null;
  try{
    renderBody();
  }catch(err){
    console.error('[render]', err);
    // 兜底：确保节点不会因为渲染异常而永久隐藏
    document.querySelectorAll('.node').forEach(el => { el.style.visibility = ''; });
  }finally{
    $('#stNodes').textContent = countNodes();
    $('#stDepth').textContent = maxDepth();
    $('#stSide').textContent = STRUCT_NAME[S.structure] || '';
    if(typeof S.onRender === 'function') { try{ S.onRender(); }catch(err){ console.warn(err); } }
  }
}

function renderBody(){
  const host = $('#nodes');
  const root = S.doc.root;

  /* ---- 5.1 建立/更新 DOM ---- */
  const flat = [];
  (function walk(n, parent, depth, side){
    flat.push({ n, parent, depth, side });
    if(!n.collapsed){
      n.children.forEach((c, i) => {
        if(parent === null) c._branchIndex = i;
        walk(c, n, depth + 1, depth === 0 ? c.side : side);
      });
    }
  })(root, null, 0, 'r');

  const keep = new Set(flat.map(f => f.n.id));
  Array.from(host.children).forEach(el => {
    if(!keep.has(el.dataset.id)) el.remove();
  });

  const existing = new Map();
  Array.from(host.children).forEach(el => existing.set(el.dataset.id, el));

  S.meta.clear();

  for(const f of flat){
    const { n, depth, side } = f;
    let el = existing.get(n.id);
    if(!el){
      el = document.createElement('div');
      el.dataset.id = n.id;
      el.innerHTML = '<div class="mk-row"></div><span class="txt"></span><div class="lb-row"></div>';
      host.appendChild(el);
    }
    const hit = S.hitSet && S.hitSet.has(n.id);
    el.className = 'node depth' + Math.min(depth, 2) +
                   (side === 'l' && depth > 0 ? ' side-l' : '') +
                   (S.sel === n.id ? ' sel' : '') +
                   (S.editing && S.editing.id === n.id ? ' editing' : '') +
                   (hit ? ' hit' : '') +
                   (hit && S.hitCur === n.id ? ' cur' : '');

    if(S.editing && S.editing.id === n.id){
      // 编辑中：不覆盖用户输入
    }else{
      const t = el.querySelector('.txt');
      if(t.textContent !== n.text) t.textContent = n.text;
    }

    applyNodeStyle(el, n);
    paintDecor(el, n);

    // 折叠开关：有子节点时常驻，收起态显示子项数
    let kid = el.querySelector('.kid');
    if(n.children.length){
      if(!kid){
        kid = document.createElement('div');
        kid.className = 'kid';
        el.appendChild(kid);
      }
      kid.textContent = n.collapsed ? ('+' + n.children.length) : '\u2212';
      kid.title = n.collapsed ? '展开' : '折叠';
      kid.classList.toggle('open', !n.collapsed);
    }else if(kid){
      kid.remove();
    }

    if(depth === 0){
      const c = root.color || (PAL[S.theme] || PAL.paper).root;
      el.style.setProperty('--nb', c);
    }
    el.style.visibility = 'hidden';
  }

  /* ---- 5.2 测量 ---- */
  const meas = new Map();
  for(const f of flat){
    const el = host.querySelector('.node[data-id="' + f.n.id + '"]');
    if(!el) continue;
    meas.set(f.n.id, { w: el.offsetWidth, h: el.offsetHeight });
  }

  /* ---- 5.3 登记尺寸 ---- */
  const rm = meas.get(root.id) || { w: 120, h: 40 };
  S.meta.set(root.id, {
    w: rm.w, h: rm.h, x: 0, y: 0, cy: 0,
    depth: 0, side: 'r', color: root.color || (PAL[S.theme] || PAL.paper).root
  });
  for(const f of flat){
    const mm = meas.get(f.n.id);
    if(!mm) continue;
    if(f.n.id === root.id) continue;
    S.meta.set(f.n.id, { w: mm.w, h: mm.h, x: 0, y: 0, cy: 0,
      depth: f.depth, side: f.side, color: null });
  }

  /* ---- 5.4 按当前版式计算坐标 ---- */
  layoutAll(root);

  /* ---- 5.5 应用位置 ---- */
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for(const f of flat){
    const meta = S.meta.get(f.n.id);
    const el = host.querySelector('.node[data-id="' + f.n.id + '"]');
    if(!meta || !el) continue;
    minX = Math.min(minX, meta.x);
    minY = Math.min(minY, meta.y);
    maxX = Math.max(maxX, meta.x + meta.w);
    maxY = Math.max(maxY, meta.y + meta.h);
  }
  if(!isFinite(minX)){ minX = 0; minY = 0; maxX = 0; maxY = 0; }

  const offX = PAD - minX;
  const offY = PAD - minY;

  for(const f of flat){
    const meta = S.meta.get(f.n.id);
    const el = host.querySelector('.node[data-id="' + f.n.id + '"]');
    if(!meta || !el) continue;
    meta.x += offX;
    meta.y += offY;
    meta.cy += offY;
    el.style.left = meta.x + 'px';
    el.style.top  = meta.y + 'px';
    el.style.visibility = '';
  }

  S.nodeBox = { w: maxX - minX, h: maxY - minY };
  S.contentW = S.nodeBox.w + PAD * 2;
  S.contentH = S.nodeBox.h + PAD * 2;

  /* ---- 5.6 连线 ---- */
  drawWires(flat, offX, offY);

  /* ---- 5.7 空态提示 ---- */
  $('#tip').classList.toggle('on', flat.length === 1);
}

const FS_MAP = { s:'12px', m:'', l:'15.5px', xl:'18px' };
const SHAPES = [
  { id:'round', name:'圆角' }, { id:'square', name:'直角' },
  { id:'pill',  name:'胶囊' }, { id:'underline', name:'下划线' }, { id:'plain', name:'无底色' }
];

function applyNodeStyle(el, n){
  const st = n.style || {};
  el.classList.remove('shape-square', 'shape-pill', 'shape-underline', 'shape-plain');

  el.style.fontSize = (st.fs && FS_MAP[st.fs]) ? FS_MAP[st.fs] : '';
  el.style.color = st.color || '';
  el.style.background = st.bg || '';
  if(st.bg){
    el.style.background = '';
    el.style.backgroundColor = st.bg;
  }
  if(st.shape && st.shape !== 'round') el.classList.add('shape-' + st.shape);
  if(st.shape === 'underline' && (st.color || n.color)){
    el.style.setProperty('--nb', st.color || '#666');
  }
}

function paintDecor(el, n){
  const row = el.querySelector('.mk-row');
  if(row){
    const ids = n.markers || [];
    const html = ids.map(id => {
      const d = MARKER_MAP[id];
      if(!d) return '';
      if(d.kind === 'pri'){
        return '<i class="mk pri" style="--mc:' + PRI_COLORS[d.v-1] + '">' + d.v + '</i>';
      }
      return '<i class="mk emo">' + d.ch + '</i>';
    }).join('');
    if(row.innerHTML !== html) row.innerHTML = html;
  }

  const lb = el.querySelector('.lb-row');
  if(lb){
    const labels = n.labels || [];
    const html = labels.map(t => '<span class="lb">' + escHTML(t) + '</span>').join('');
    if(lb.innerHTML !== html) lb.innerHTML = html;
  }

  let dot = el.querySelector('.note-dot');
  const hasNote = !!(n.note && n.note.trim());
  if(hasNote){
    if(!dot){
      dot = document.createElement('div');
      dot.className = 'note-dot';
      el.appendChild(dot);
    }
    dot.title = n.note.slice(0, 400);
  }else if(dot){
    dot.remove();
  }
}

function drawWires(flat, offX, offY){
  const svg = $('#wires');
  const pal = PAL[S.theme] || PAL.paper;
  const st  = S.structure;
  const rootM = S.meta.get(S.doc.root.id);

  let px = Infinity, py = Infinity, ax = -Infinity, ay = -Infinity;
  for(const f of flat){
    const m = S.meta.get(f.n.id);
    if(!m) continue;
    px = Math.min(px, m.x); py = Math.min(py, m.y);
    ax = Math.max(ax, m.x + m.w); ay = Math.max(ay, m.y + m.h);
  }
  if(!isFinite(px)){ px = 0; py = 0; ax = 0; ay = 0; }

  const gx = Math.floor(px) - 40, gy = Math.floor(py) - 40;
  svg.style.left = gx + 'px';
  svg.style.top  = gy + 'px';
  svg.setAttribute('width',  Math.max(1, ax - gx + 40));
  svg.setAttribute('height', Math.max(1, ay - gy + 40));

  const X = v => v - gx, Y = v => v - gy;
  const P = (d, col, wd, op) =>
    `<path class="wire" d="${d}" stroke="${col}" stroke-width="${wd}" opacity="${op}" stroke-linejoin="round" stroke-linecap="round"/>`;

  let out = '';
  const axisY = rootM ? rootM.cy : 0;

  // 时间轴主轴
  if(st === 'timeline' && rootM && flat.length > 1){
    out += `<line x1="${X(rootM.x + rootM.w)}" y1="${Y(axisY)}" x2="${X(ax)}" y2="${Y(axisY)}"
      stroke="${rootM.color || pal.cols[0]}" stroke-width="2.2" opacity=".28" stroke-linecap="round"/>`;
  }

  for(const f of flat){
    const { n } = f;
    if(!n.children.length || n.collapsed) continue;
    const pm = S.meta.get(n.id);
    if(!pm) continue;
    const pcol = pm.color || pal.cols[0];
    const kids = [];
    for(const c of n.children){
      const cm = S.meta.get(c.id);
      if(cm) kids.push(cm);
    }
    if(!kids.length) continue;

    if(st === 'org'){
      /* 组织架构：共享干线 + 每子一条垂线 */
      const cx = pm.x + pm.w / 2;
      const y1 = pm.y + pm.h;
      const topY = Math.min.apply(null, kids.map(m => m.y));
      const midY = y1 + (topY - y1) * 0.5;
      const kxs = kids.map(m => m.x + m.w / 2);
      const minKx = Math.min.apply(null, kxs), maxKx = Math.max.apply(null, kxs);

      out += P(`M${X(cx)} ${Y(y1)}V${Y(midY)}`, pcol, 2, .8);
      if(maxKx - minKx > 1){
        out += P(`M${X(minKx)} ${Y(midY)}H${X(maxKx)}`, pcol, 2, .8);
      }
      kids.forEach((m, k) => {
        out += P(`M${X(kxs[k])} ${Y(midY)}V${Y(m.y)}`,
                 m.color || pcol, 1.8, .78);
      });

    }else if(st === 'tree'){
      /* 树状图：父节点中心垂直下降，再弯向子节点 */
      const cx = pm.x + pm.w / 2;
      const y1 = pm.y + pm.h;
      kids.forEach(cm => {
        const x2 = cm.x + cm.w / 2, y2 = cm.y;
        const span = Math.max(10, y2 - y1);
        const midY = y1 + span * 0.5;
        const d = `M${X(cx)} ${Y(y1)}V${Y(midY)}` +
                  `C${X(cx)} ${Y(midY + span * 0.30)} ${X(x2)} ${Y(y2 - span * 0.22)} ${X(x2)} ${Y(y2)}`;
        const op = Math.max(0.34, 0.92 - (cm.depth || 1) * 0.10);
        out += P(d, cm.color || pcol, cm.depth === 1 ? 2.4 : 1.7, op);
      });

    }else if(st === 'timeline'){
      /* 时间轴：一级从主轴引出，深层沿父节点方向延伸 */
      if(n === S.doc.root){
        kids.forEach(cm => {
          const x = cm.x + cm.w / 2;
          const up = cm.cy < axisY;
          const y2 = up ? cm.y + cm.h : cm.y;
          out += P(`M${X(x)} ${Y(axisY)}V${Y(y2)}`, cm.color || pcol, 1.8, .6);
        });
      }else{
        kids.forEach(cm => {
          const up = cm.cy < pm.cy;
          const x1 = pm.x + pm.w / 2, y1 = up ? pm.y : pm.y + pm.h;
          const x2 = cm.x + cm.w / 2, y2 = up ? cm.y + cm.h : cm.y;
          const dy = (y2 - y1) * 0.45;
          const d = `M${X(x1)} ${Y(y1)}C${X(x1)} ${Y(y1 + dy)} ${X(x2)} ${Y(y2 - dy)} ${X(x2)} ${Y(y2)}`;
          const op = Math.max(0.34, 0.92 - (cm.depth || 1) * 0.10);
          out += P(d, cm.color || pcol, cm.depth === 1 ? 2.4 : 1.7, op);
        });
      }

    }else{
      /* 横向：逻辑图 / 思维导图 */
      const radial = (st === 'mindmap' && n === S.doc.root);
      kids.forEach(cm => {
        const leftward = cm.x + cm.w / 2 < pm.x + pm.w / 2;
        const x2 = X(leftward ? cm.x + cm.w : cm.x);
        const y2 = Y(cm.cy);
        const y1 = Y(pm.cy);
        const op = Math.max(0.34, 0.92 - (cm.depth || 1) * 0.10);

        if(radial){
          // 思维导图：从根节点中心向外辐射
          const x1 = X(pm.x + pm.w / 2);
          const dx = Math.max(24, Math.abs(x2 - x1) * 0.55);
          const dir = leftward ? -1 : 1;
          const d = `M${x1} ${y1}C${x1 + dx * dir} ${y1} ${x2 - dx * dir} ${y2} ${x2} ${y2}`;
          out += P(d, cm.color || pcol, 2.6, op);
        }else{
          const x1 = X(leftward ? pm.x : pm.x + pm.w);
          const dx = Math.max(18, Math.abs(x2 - x1) * 0.44);
          const dir = leftward ? -1 : 1;
          const d = `M${x1} ${y1} C${x1 + dx * dir} ${y1} ${x2 - dx * dir} ${y2} ${x2} ${y2}`;
          out += P(d, cm.color || pcol, cm.depth === 1 ? 2.4 : 1.7, op);
        }
      });
    }
  }

  svg.innerHTML = out;
}

/* ---- 视口 ---- */
function applyView(){
  $('#world').style.transform =
    `translate(${S.panX}px,${S.panY}px) scale(${S.scale})`;
  $('#zoomVal').textContent = Math.round(S.scale * 100) + '%';
}
function zoomAt(factor, cx, cy){
  const stage = $('#stage').getBoundingClientRect();
  cx = (cx === undefined) ? stage.width / 2 : cx;
  cy = (cy === undefined) ? stage.height / 2 : cy;
  const ns = clamp(S.scale * factor, 0.18, 3.2);
  const k = ns / S.scale;
  S.panX = cx - (cx - S.panX) * k;
  S.panY = cy - (cy - S.panY) * k;
  S.scale = ns;
  applyView();
}
function fitView(animate){
  const stage = $('#stage').getBoundingClientRect();
  const box = S.nodeBox || { w: 800, h: 600 };
  const cw = Math.max(1, box.w), ch = Math.max(1, box.h);
  const small = stage.width < 600;
  const pad = small ? 20 : 72;
  const s = clamp(Math.min((stage.width - pad*2) / cw, (stage.height - pad*2) / ch),
                  small ? 0.46 : 0.18, 1.05);
  S.scale = s;
  S.panX = (stage.width - cw * s) / 2 - PAD * s;
  S.panY = (stage.height - ch * s) / 2 - PAD * s;
  if(animate){
    $('#world').style.transition = 'transform .26s cubic-bezier(.22,.7,.3,1)';
    setTimeout(() => { $('#world').style.transition = ''; }, 300);
  }
  applyView();
  persist();
}

/* =====================================================================
   6. DOM 就绪后的初始化挂载点（后续脚本补全）
   ===================================================================== */
window.__MM__ = { $, S, PAL, THEMES, FONT, STRUCTURES, STRUCT_NAME, MARKERS, MARKER_MAP, PRI_COLORS, escHTML, SHAPES, FS_MAP, render, doRender, applyView, zoomAt, fitView,
  pushUndo, undo, redo, touch, persist, findNode, findParent, allNodes,
  clone, uid, clamp, LS_DOC, LS_UI, blankDoc, branchColor, syncUndoUI, countNodes, maxDepth };

/* 标记脚本已就绪，交互层随后挂载 */
window.__MM_READY__ = true;

})();

<script>
"use strict";
(function(){
const M = window.__MM__;
const $$ = s => Array.from(document.querySelectorAll(s));
const { $, S, PAL, THEMES, FONT, STRUCTURES, STRUCT_NAME, MARKERS, MARKER_MAP, PRI_COLORS, escHTML, SHAPES, FS_MAP, render, applyView, zoomAt, fitView,
        pushUndo, undo, redo, touch, persist, findNode, findParent,
        allNodes, clone, uid, clamp, blankDoc, syncUndoUI } = M;

/* =====================================================================
   7. 反馈
   ===================================================================== */
let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1900);
}

/* =====================================================================
   8. 文档读写
   ===================================================================== */
function sanitize(d){
  const fix = (n) => ({
    id: n.id || uid(),
    text: typeof n.text === 'string' ? n.text : '',
    color: n.color || null,
    collapsed: !!n.collapsed,
    side: n.side === 'l' ? 'l' : 'r',
    markers: Array.isArray(n.markers) ? n.markers.slice(0, 12) : [],
    labels: Array.isArray(n.labels) ? n.labels.slice(0, 8).map(String) : [],
    note: typeof n.note === 'string' ? n.note : '',
    style: (n.style && typeof n.style === 'object') ? n.style : null,
    children: Array.isArray(n.children) ? n.children.map(fix) : []
  });
  return {
    app:'MindMap', version:2,
    structure: (d && d.structure && STRUCT_NAME[d.structure]) ? d.structure
              : ((d && d.layoutMode === 'both') ? 'logic-both' : 'logic-right'),
    title: (d && d.title) || '未命名导图',
    updatedAt: (d && d.updatedAt) || new Date().toISOString(),
    root: fix((d && d.root) || {})
  };
}

function serialize(){
  return JSON.stringify(S.doc, (k, v) => (k.charAt(0) === '_' ? undefined : v), 2);
}

function syncTitle(){
  document.title = (S.doc.title || '未命名导图');
}

function loadDoc(obj, opts){
  opts = opts || {};
  S.doc = sanitize(obj);
  S.sel = null;
  S.editing = null;
  S.undo.length = 0;
  S.redo.length = 0;
  syncUndoUI();
  $('#docTitle').value = S.doc.title;
  if(S.doc.structure) S.structure = S.doc.structure;
  syncTitle();
  S.dirty = false;
  $('#dirty').classList.remove('on');
  render();
  requestAnimationFrame(() => fitView(false));
  if(opts.toast !== false) toast('已载入《' + S.doc.title + '》');
}

function newDoc(confirmFirst){
  if(confirmFirst && M.countNodes() > 1){
    if(!confirm('新建导图会清空当前内容（已自动保存的副本仍可恢复）。继续？')) return;
  }
  loadDoc(blankDoc(), { toast:false });
  $('#stSaved').textContent = '新建导图';
  toast('新导图已创建');
  setTimeout(() => selectAndEditRoot(), 60);
}

function selectAndEditRoot(){
  S.sel = S.doc.root.id;
  render();
  setTimeout(() => startEdit(S.doc.root.id), 30);
}

/* =====================================================================
   9. 编辑
   ===================================================================== */
function startEdit(id, isNew){
  const n = findNode(id);
  if(!n) return;
  if(S.editing && S.editing.id === id) return;
  commitEdit();
  S.editing = { id, isNew: !!isNew };
  S.sel = id;
  render();
  requestAnimationFrame(() => {
    const el = document.querySelector('.node[data-id="' + id + '"] .txt');
    if(!el) return;
    el.setAttribute('contenteditable', 'true');
    if(!(n && n.text)) el.innerHTML = '';
    el.focus({ preventScroll:true });
    const r = document.createRange();
    r.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
  });
}

function commitEdit(){
  if(!S.editing) return false;
  const id = S.editing.id;
  const wasNew = S.editing.isNew;
  const el = document.querySelector('.node[data-id="' + id + '"] .txt');
  const n = findNode(id);
  S.editing = null;

  if(el){
    el.removeAttribute('contenteditable');
    const t = el.textContent.replace(/\u00a0/g, ' ').replace(/[\r\n]+$/, '').trim();
    if(n){
      if(!t){
        if(n === S.doc.root){
          n.text = '中心主题';
        }else{
          const p = findParent(id);
          if(p){
            const idx = p.children.findIndex(c => c.id === id);
            if(idx >= 0) p.children.splice(idx, 1);
            if(p.children.length){ /* 保持 */ }
          }
          if(S.sel === id) S.sel = null;
        }
      }else{
        n.text = t;
      }
    }
  }
  touch();
  render();
  if(wasNew && !findNode(id)) return true;
  return true;
}

function isEditingBlank(){
  if(!S.editing) return false;
  const el = document.querySelector('.node[data-id="' + S.editing.id + '"] .txt');
  return el ? !el.textContent.replace(/\u00a0/g,' ').trim() : true;
}

function cancelEdit(){
  if(!S.editing) return;
  const { id, isNew } = S.editing;
  const el = document.querySelector('.node[data-id="' + id + '"] .txt');
  const typed = el ? el.textContent.replace(/\u00a0/g, ' ').trim() : '';
  S.editing = null;

  const n = findNode(id);
  if(n && typed && typed !== n.text){
    // 已输入的内容不因 Esc 而丢失
    n.text = typed;
    touch();
  }else if(isNew && n && n !== S.doc.root && !n.text && !typed){
    const p = findParent(id);
    if(p) p.children = p.children.filter(c => c.id !== id);
  }
  render();
}

/* 结构操作 */
function addChild(parentId, autoEdit){
  const p = findNode(parentId);
  if(!p) return;
  pushUndo();
  if(p.collapsed) p.collapsed = false;
  const n = { id:uid(), text:'', color:null, collapsed:false,
              side: p.side || 'r', children:[] };
  p.children.push(n);
  S.sel = n.id;
  touch();
  render();
  if(autoEdit !== false) setTimeout(() => startEdit(n.id, true), 20);
}

function addSibling(id, autoEdit){
  const n = findNode(id);
  if(!n) return;
  if(n === S.doc.root){ addChild(id, autoEdit); return; }
  const p = findParent(id);
  if(!p) return;
  pushUndo();
  const nn = { id:uid(), text:'', color:null, collapsed:false,
               side:n.side || 'r', children:[] };
  const idx = p.children.findIndex(c => c.id === id);
  p.children.splice(idx + 1, 0, nn);
  S.sel = nn.id;
  touch();
  render();
  if(autoEdit !== false) setTimeout(() => startEdit(nn.id, true), 20);
}

function deleteNode(id){
  if(!id) return;
  const n = findNode(id);
  if(!n) return;
  if(n === S.doc.root){
    toast('中心主题不能删除');
    return;
  }
  const sub = allNodes(n).length;
  if(sub > 1){
    if(!confirm('该节点下还有 ' + (sub - 1) + ' 个节点，一并删除？')) return;
  }
  const p = findParent(id);
  pushUndo();
  p.children = p.children.filter(c => c.id !== id);
  S.sel = p.id;
  touch();
  render();
  toast('已删除' + (sub > 1 ? ' ' + sub + ' 个节点' : '') + '（⌘Z 可撤销）');
}

function toggleCollapse(id){
  const n = findNode(id);
  if(!n || !n.children.length) return;
  pushUndo();
  n.collapsed = !n.collapsed;
  touch();
  render();
}

function reparent(id, targetId){
  const n = findNode(id);
  const t = findNode(targetId);
  if(!n || !t || n === t) return;
  // 禁止移到自己的后代
  if(allNodes(n).some(x => x.id === targetId)) return;
  if(findParent(id) === t) return;  // 已经是子节点
  pushUndo();
  const p = findParent(id);
  if(p) p.children = p.children.filter(c => c.id !== id);
  n.side = t.side || 'r';
  t.collapsed = false;
  t.children.push(n);
  S.sel = id;
  touch();
  render();
  toast('已移动到「' + (t.text || '未命名') + '」下');
}

function toggleMarker(id, mid){
  const n = findNode(id);
  if(!n) return;
  pushUndo();
  n.markers = n.markers || [];
  const i = n.markers.indexOf(mid);
  if(i >= 0){
    n.markers.splice(i, 1);
  }else{
    if(mid.indexOf('pri-') === 0){
      n.markers = n.markers.filter(x => x.indexOf('pri-') !== 0);
    }
    n.markers.push(mid);
  }
  touch();
  render();
  if(lastMenu && lastMenu.id === id){
    setTimeout(() => { if(lastMenu) showMenu(lastMenu.x, lastMenu.y, id); }, 10);
  }
}

function setColor(id, color){
  const n = findNode(id);
  if(!n) return;
  pushUndo();
  n.color = color;
  touch();
  render();
}

/* =====================================================================
   10. 选择 & 键盘导航
   ===================================================================== */
function select(id){
  S.sel = id;
  render();
}

function navigate(dir){
  if(!S.sel) { select(S.doc.root.id); return; }
  const n = findNode(S.sel);
  if(!n) return;
  const m = S.meta.get(S.sel);
  const p = findParent(S.sel);

  if(dir === 'left'){
    if(p) select(p.id);
    return;
  }
  if(dir === 'right'){
    if(n.children.length && !n.collapsed){ select(n.children[0].id); }
    return;
  }
  if(!p) return;
  const sibs = p.children.map(c => ({ c, y: (S.meta.get(c.id) || { y:0 }).y }))
                        .sort((a,b) => a.y - b.y);
  const i = sibs.findIndex(s => s.c.id === S.sel);
  const j = dir === 'up' ? i - 1 : i + 1;
  if(j >= 0 && j < sibs.length) select(sibs[j].c.id);
}

/* =====================================================================
   11. 指针交互：平移 / 缩放 / 拖动节点
   ===================================================================== */
const stage = $('#stage');
const view  = $('#world');

const drag = { mode:null, sx:0, sy:0, moved:false, id:null, ox:0, oy:0, target:null, pid:null };

/* 多指与长按 */
const ptrs = new Map();
let pinch = null;
let lpTimer = null, lpStart = null;

function clearLongPress(){
  if(lpTimer){ clearTimeout(lpTimer); lpTimer = null; }
}

function pinchCenter(){
  const r = stage.getBoundingClientRect();
  const [a, b] = [...ptrs.values()];
  return {
    dist: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)),
    cx: (a.x + b.x) / 2 - r.left,
    cy: (a.y + b.y) / 2 - r.top
  };
}

stage.addEventListener('pointerdown', (e) => {
  if(e.button === 2) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if(ptrs.size === 2){
    const c = pinchCenter();
    pinch = { dist: c.dist, scale: S.scale, cx: c.cx, cy: c.cy };
    drag.mode = null;
    drag.pid = null;
    clearLongPress();
    stage.classList.remove('panning', 'dropping');
    return;
  }
  if(ptrs.size > 2) return;

  const kidEl  = e.target.closest('.kid');
  const nodeEl = e.target.closest('.node');

  if(kidEl){
    const host = kidEl.closest('.node');
    if(host) toggleCollapse(host.dataset.id);
    e.preventDefault();
    return;
  }

  const noteEl = e.target.closest('.note-dot');
  if(noteEl){
    const host = noteEl.closest('.node');
    if(host) openModal('note', host.dataset.id);
    e.preventDefault();
    e.stopPropagation();
    return;
  }

  if(S.editing){
    if(!(nodeEl && nodeEl.dataset.id === S.editing.id)) commitEdit();
    else return;  // 正在编辑自己，交给浏览器处理光标
  }

  drag.sx = e.clientX; drag.sy = e.clientY;
  drag.moved = false; drag.target = null; drag.pid = e.pointerId;

  if(nodeEl){
    drag.mode = 'node';
    drag.id = nodeEl.dataset.id;
    try{ stage.setPointerCapture(e.pointerId); }catch(err){}

    if(e.pointerType !== 'mouse'){
      clearLongPress();
      lpStart = { x: e.clientX, y: e.clientY, id: nodeEl.dataset.id };
      lpTimer = setTimeout(() => {
        lpTimer = null;
        if(!lpStart) return;
        const id = lpStart.id;
        drag.mode = null;
        drag.id = null;
        if(S.sel !== id){ S.sel = id; render(); }
        showMenu(lpStart.x, lpStart.y, id);
        if(navigator.vibrate) { try{ navigator.vibrate(8); }catch(err){} }
      }, 520);
    }
  }else{
    drag.mode = 'pan';
    drag.ox = S.panX; drag.oy = S.panY;
    stage.classList.add('panning');
    try{ stage.setPointerCapture(e.pointerId); }catch(err){}
  }
});

stage.addEventListener('pointermove', (e) => {
  if(ptrs.has(e.pointerId)){
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  }

  if(pinch && ptrs.size === 2){
    const c = pinchCenter();
    const ns = clamp(pinch.scale * (c.dist / pinch.dist), 0.18, 3.2);
    const k = ns / S.scale;
    S.panX = c.cx - (c.cx - S.panX) * k;
    S.panY = c.cy - (c.cy - S.panY) * k;
    S.scale = ns;
    applyView();
    return;
  }

  if(!drag.mode) return;
  const dx = e.clientX - drag.sx;
  const dy = e.clientY - drag.sy;
  if(!drag.moved && Math.hypot(dx, dy) < 5) return;
  drag.moved = true;
  clearLongPress();

  if(drag.mode === 'pan'){
    S.panX = drag.ox + dx;
    S.panY = drag.oy + dy;
    applyView();
    return;
  }

  if(drag.mode === 'node'){
    const el = document.querySelector('.node[data-id="' + drag.id + '"]');
    if(!el) return;
    el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(1.02)';
    el.style.zIndex = 20;
    el.style.pointerEvents = 'none';

    const hit = document.elementFromPoint(e.clientX, e.clientY);
    const tEl = hit && hit.closest ? hit.closest('.node') : null;
    const tid = tEl ? tEl.dataset.id : null;
    const valid = tid && tid !== drag.id &&
                  !allNodes(findNode(drag.id)).some(x => x.id === tid) &&
                  findParent(drag.id) !== findNode(tid);

    document.querySelectorAll('.node.droptar').forEach(x => x.classList.remove('droptar'));
    if(valid){
      tEl.classList.add('droptar');
      drag.target = tid;
      stage.classList.add('dropping');
    }else{
      drag.target = null;
      stage.classList.remove('dropping');
    }
  }
});

function endDrag(e){
  if(e && e.pointerId !== undefined){
    ptrs.delete(e.pointerId);
    if(ptrs.size < 2) pinch = null;
  }
  clearLongPress();
  lpStart = null;
  if(ptrs.size >= 2) return;
  if(!drag.mode) return;
  const mode = drag.mode;
  const moved = drag.moved;
  const id = drag.id, target = drag.target;

  stage.classList.remove('panning', 'dropping');
  document.querySelectorAll('.node.droptar').forEach(x => x.classList.remove('droptar'));
  const el = drag.id && document.querySelector('.node[data-id="' + drag.id + '"]');
  if(el){ el.style.transform = ''; el.style.zIndex = ''; el.style.pointerEvents = ''; }

  drag.mode = null; drag.id = null; drag.target = null;

  if(mode === 'node'){
    if(moved && target) reparent(id, target);
    else if(!moved) select(id);
    else { render(); }
  }
  if(stage.hasPointerCapture && drag.pid !== null){
    try{ stage.releasePointerCapture(drag.pid); }catch(err){}
  }
  drag.pid = null;
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

/* 缩放 */
stage.addEventListener('wheel', (e) => {
  if(e.ctrlKey || e.metaKey){
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    zoomAt(e.deltaY < 0 ? 1.12 : 1/1.12, e.clientX - r.left, e.clientY - r.top);
  }else{
    e.preventDefault();
    S.panX -= e.deltaX;
    S.panY -= e.deltaY;
    applyView();
  }
}, { passive:false });

/* 双击编辑 */
stage.addEventListener('dblclick', (e) => {
  const nodeEl = e.target.closest('.node');
  if(!nodeEl) return;
  e.preventDefault();
  startEdit(nodeEl.dataset.id);
});

/* 右键菜单 */
stage.addEventListener('contextmenu', (e) => {
  const nodeEl = e.target.closest('.node');
  e.preventDefault();
  if(nodeEl){
    const id = nodeEl.dataset.id;
    if(S.sel !== id){ S.sel = id; render(); }
    showMenu(e.clientX, e.clientY, id);
  }else{
    showMenu(e.clientX, e.clientY, null);
  }
});

/* =====================================================================
   12. 右键菜单
   ===================================================================== */

const menu = $('#menu');
let menuAnchor = null;

function placeMenu(){
  if(!menu.classList.contains('open')) return;
  const r = menu.getBoundingClientRect();
  if(!r.width) return;
  const vw = document.documentElement.clientWidth;
  const vh = document.documentElement.clientHeight;
  const a = menuAnchor || { x: r.left, y: r.top };
  menu.style.left = Math.max(8, Math.min(a.x, vw - r.width - 10)) + 'px';
  menu.style.top  = Math.max(8, Math.min(a.y, vh - r.height - 10)) + 'px';
}

if(window.ResizeObserver){
  const ro = new ResizeObserver(() => placeMenu());
  ro.observe(menu);
}

let lastMenu = null;

function showMenu(x, y, id){
  lastMenu = { x, y, id };
  const items = [];
  const pal = PAL[S.theme] || PAL.paper;

  if(id){
    const n = findNode(id);
    items.push({ ic:ICON.plus,  label:'添加子节点', k:'Tab',   act:() => addChild(id) });
    if(n !== S.doc.root)
      items.push({ ic:ICON.enter, label:'添加同级', k:'↩',   act:() => addSibling(id) });
    items.push({ ic:ICON.pen,   label:'编辑文字', k:'F2',     act:() => startEdit(id) });
    items.push({ ic:ICON.note,  label:(n.note && n.note.trim()) ? '编辑备注' : '添加备注',
                                 k:'', act:() => openModal('note', id) });
    items.push({ ic:ICON.tag,   label:(n.labels && n.labels.length) ? '标签 · ' + n.labels.length : '添加标签',
                                 k:'', act:() => openModal('labels', id) });
    items.push({ type:'markers', current: n.markers || [] });
    items.push({ ic:ICON.brush, label:'节点样式…', k:'',
                 act:() => openStylePanel(id, lastMenu.x, lastMenu.y) });

    if(n.children.length)
      items.push({ ic:ICON.fold, label:n.collapsed ? '展开 ' + n.children.length + ' 项' : '折叠',
                                   k:'', act:() => toggleCollapse(id) });

    if(findParent(id) === S.doc.root && (S.structure === 'logic-both' || S.structure === 'mindmap'))
      items.push({ ic:ICON.swap, label:'移到' + (n.side === 'l' ? '右侧' : '左侧'),
                                   k:'', act:() => {
        pushUndo();
        n.side = n.side === 'l' ? 'r' : 'l';
        touch(); render();
      }});

    items.push({ type:'colors', colors:pal.cols, current:n.color });
    items.push({ type:'sep' });
    if(n !== S.doc.root)
      items.push({ ic:ICON.trash, label:'删除节点', k:'⌫', danger:true, act:() => deleteNode(id) });
  }else{
    items.push({ ic:ICON.fit, label:'适应窗口', k:'⌘0', act:() => fitView(true) });
    items.push({ ic:ICON.find, label:'搜索节点', k:'⌘F', act:() => openFind() });
    items.push({ ic:ICON.outline, label:'大纲视图', k:'', act:() => toggleOutline() });
    items.push({ type:'sep' });
    items.push({ ic:ICON.save, label:'保存为文件', k:'⌘S', act:() => actSave() });
    items.push({ ic:ICON.open, label:'打开文件', k:'⌘O', act:() => actOpen() });
    items.push({ ic:ICON.img,  label:'导出图片', k:'⌘E', act:() => actExportPNG() });
    items.push({ type:'sep' });
    items.push({ ic:ICON.plus, label:'新建导图', k:'⌘N', act:() => newDoc(true) });
  }

  menu.innerHTML = '';
  items.forEach(it => {
    if(it.type === 'sep'){
      const d = document.createElement('div'); d.className = 'mdiv'; menu.appendChild(d); return;
    }
    if(it.type === 'markers'){
      const head = document.createElement('div');
      head.className = 'pop-head';
      head.textContent = '标记';
      menu.appendChild(head);
      const grid = document.createElement('div');
      grid.className = 'mk-grid';
      MARKERS.forEach(mk => {
        const cell = document.createElement('div');
        cell.className = 'mk-cell' + (it.current.indexOf(mk.id) >= 0 ? ' on' : '');
        cell.title = mk.name;
        cell.innerHTML = (mk.kind === 'pri')
          ? '<span class="n" style="background:' + PRI_COLORS[mk.v-1] + '">' + mk.v + '</span>'
          : mk.ch;
        cell.onclick = (ev) => { ev.stopPropagation(); toggleMarker(id, mk.id); };
        grid.appendChild(cell);
      });
      menu.appendChild(grid);
      return;
    }
    if(it.type === 'colors'){
      const row = document.createElement('div'); row.className = 'mswatches';
      const none = document.createElement('div');
      none.className = 'sw' + (it.current ? '' : ' on');
      none.style.background = 'transparent';
      none.style.borderColor = 'var(--line-strong)';
      none.title = '默认';
      none.onclick = () => { setColor(id, null); hideMenu(); };
      row.appendChild(none);
      it.colors.forEach(c => {
        const sw = document.createElement('div');
        sw.className = 'sw' + (it.current === c ? ' on' : '');
        sw.style.background = c;
        sw.onclick = () => { setColor(id, c); hideMenu(); };
        row.appendChild(sw);
      });
      menu.appendChild(row);
      return;
    }
    const el = document.createElement('div');
    el.className = 'mitem';
    if(it.danger) el.style.color = 'var(--accent)';
    el.innerHTML = '<span class="ic">' + (it.ic || '') + '</span><span>' + it.label + '</span>' +
                   (it.k ? '<span class="k">' + it.k + '</span>' : '');
    el.onclick = () => { hideMenu(); it.act(); };
    menu.appendChild(el);
  });

  menuAnchor = { x, y };
  menu.classList.add('open');
  placeMenu();
  requestAnimationFrame(placeMenu);
  // 字体与图标异步加载会改变高度，多次校正到稳定
  [80, 200, 420, 700].forEach(t => setTimeout(placeMenu, t));
}

function hideMenu(){ menu.classList.remove('open'); }
document.addEventListener('pointerdown', (e) => {
  if(!menu.contains(e.target)) hideMenu();
}, true);
window.addEventListener('blur', hideMenu);

/* =====================================================================
   12.2 大纲视图
   ===================================================================== */
const olBody = $('#olBody');

function flattenTree(){
  const out = [];
  (function walk(n, depth){
    const m = S.meta.get(n.id);
    out.push({ n, depth, color: m ? m.color : null });
    if(!n.collapsed) n.children.forEach(c => walk(c, depth + 1));
  })(S.doc.root, 0);
  return out;
}

function buildOutline(force){
  if(!S.outlineOn) return;
  const ae = document.activeElement;
  if(!force && ae && ae.closest && ae.closest('#outline')) return;

  const rows = flattenTree();
  const f = (S.outlineFilter || '').trim().toLowerCase();

  olBody.innerHTML = rows.map(r => {
    const n = r.n;
    const hasKids = n.children.length > 0;
    const tw = hasKids ? (n.collapsed ? '\u25b8' : '\u25be') : '';
    const hit = f && ((n.text || '').toLowerCase().indexOf(f) >= 0 ||
                      (n.note || '').toLowerCase().indexOf(f) >= 0 ||
                      (n.labels || []).join(' ').toLowerCase().indexOf(f) >= 0);
    const marks = (n.markers || []).map(id => {
      const d = MARKER_MAP[id];
      if(!d) return '';
      if(d.kind === 'pri') return '<i style="color:' + PRI_COLORS[d.v-1] + '">' + d.v + '</i>';
      return '<i>' + d.ch + '</i>';
    }).join('');
    return '<div class="ol-row' + (n.id === S.sel ? ' sel' : '') + (hit ? ' hit' : '') +
           '" data-id="' + n.id + '" style="padding-left:' + (r.depth * 15 + 4) + 'px">' +
           '<span class="ol-tw' + (hasKids ? '' : ' leaf') + '" data-tw="' + n.id + '">' + tw + '</span>' +
           '<span class="ol-dot" style="--bc:' + (r.color || '#bbb') + '"></span>' +
           '<span class="ol-txt" data-txt="' + n.id + '">' + escHTML(n.text || '') + '</span>' +
           (marks ? '<span class="ol-tags">' + marks + '</span>' : '') +
           '</div>';
  }).join('');

  $('#olCount').textContent = rows.length + ' 项';
}

function toggleOutline(force){
  S.outlineOn = (force === undefined) ? !S.outlineOn : !!force;
  $('#outline').classList.toggle('on', S.outlineOn);
  $('#btnOutline').classList.toggle('on', S.outlineOn);
  if(S.outlineOn){ buildOutline(true); }
  setTimeout(() => fitView(false), 80);
  try{ localStorage.setItem(M.LS_UI, JSON.stringify({ theme:S.theme, structure:S.structure,
    scale:S.scale, panX:S.panX, panY:S.panY, outline:S.outlineOn })); }catch(e){}
}

function centerOn(id){
  const m = S.meta.get(id);
  if(!m) return;
  const st = $('#stage').getBoundingClientRect();
  S.panX = st.width / 2 - (m.x + m.w / 2) * S.scale;
  S.panY = st.height / 2 - m.cy * S.scale;
  applyView();
}

function olStartEdit(id){
  const el = olBody.querySelector('.ol-txt[data-txt="' + id + '"]');
  if(!el) return;
  el.setAttribute('contenteditable', 'true');
  el.focus();
  if(document.activeElement !== el){ setTimeout(() => el.focus(), 0); }
  const r = document.createRange();
  r.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(r);
}

function olCommit(id, el){
  const n = findNode(id);
  if(!n || !el) return;
  el.removeAttribute('contenteditable');
  const t = el.textContent.replace(/\u00a0/g, ' ').replace(/[\r\n]+$/, '').trim();
  if(t !== n.text && (t || n !== S.doc.root)){
    pushUndo();
    n.text = t;
    touch();
    render();
  }
}

function olIndent(id){
  const n = findNode(id);
  if(!n || n === S.doc.root) return;
  const p = findParent(id);
  if(!p) return;
  const idx = p.children.findIndex(c => c.id === id);
  if(idx <= 0){ toast('前面没有同级节点，无法缩进'); return; }
  const prev = p.children[idx - 1];
  pushUndo();
  p.children.splice(idx, 1);
  prev.children.push(n);
  prev.collapsed = false;
  n.side = prev.side || 'r';
  touch(); render();
  setTimeout(() => centerOn(id), 60);
}

function olOutdent(id){
  const n = findNode(id);
  if(!n || n === S.doc.root) return;
  const p = findParent(id);
  if(!p || p === S.doc.root){ toast('已经是第一层级'); return; }
  const gp = findParent(p.id);
  if(!gp) return;
  pushUndo();
  p.children = p.children.filter(c => c.id !== id);
  const idx = gp.children.findIndex(c => c.id === p.id);
  gp.children.splice(idx + 1, 0, n);
  n.side = p.side || 'r';
  touch(); render();
  setTimeout(() => centerOn(id), 60);
}

olBody.addEventListener('click', (e) => {
  const tw = e.target.closest('.ol-tw');
  if(tw && !tw.classList.contains('leaf')){
    toggleCollapse(tw.dataset.tw);
    return;
  }
  const row = e.target.closest('.ol-row');
  if(!row) return;
  const id = row.dataset.id;
  if(S.editing) commitEdit();
  select(id);
  centerOn(id);
});

olBody.addEventListener('dblclick', (e) => {
  const txt = e.target.closest('.ol-txt');
  if(!txt) return;
  e.preventDefault();
  olStartEdit(txt.dataset.txt);
});

olBody.addEventListener('blur', (e) => {
  const txt = e.target.closest && e.target.closest('.ol-txt');
  if(txt){ olCommit(txt.dataset.txt, txt); setTimeout(() => buildOutline(true), 30); }
}, true);

$('#btnOutline').onclick = () => toggleOutline();
$('#olClose').onclick = () => toggleOutline(false);

S.onRender = buildOutline;

/* =====================================================================
   12.4 节点样式面板
   ===================================================================== */
const stylePop = $('#stylePop');
let styleTarget = null;
let lastStylePos = null;

const TEXT_COLORS = ['#26221c','#c2543c','#b06a2c','#2f7f5f','#2f6f9f','#7a5c8e','#8a8a8a','#ffffff'];
const BG_COLORS   = ['#fdf3ec','#fbe9e5','#eef4ee','#e8f0f7','#f5eef7','#fdf7e2','#eef0f2','#1f1d1a'];

function buildStylePop(id){
  const n = findNode(id);
  if(!n) return;
  styleTarget = id;
  const st = n.style || {};

  const part = [];

  part.push('<div class="pop-head">字号</div><div class="sp-row">');
  [['s','小'],['m','中'],['l','大'],['xl','特大']].forEach(x => {
    part.push('<button class="sp-btn' + ((st.fs || 'm') === x[0] ? ' on' : '') +
              '" data-fs="' + x[0] + '">' + x[1] + '</button>');
  });
  part.push('</div>');

  part.push('<div class="pop-head">形状</div><div class="sp-row">');
  SHAPES.forEach(x => {
    part.push('<button class="sp-btn' + ((st.shape || 'round') === x.id ? ' on' : '') +
              '" data-shape="' + x.id + '">' + x.name + '</button>');
  });
  part.push('</div>');

  part.push('<div class="pop-head">文字颜色</div><div class="sp-swatches">');
  part.push('<div class="sp-sw none" data-color=""></div>');
  TEXT_COLORS.forEach(c => {
    part.push('<div class="sp-sw' + (st.color === c ? ' on' : '') +
              '" data-color="' + c + '" style="background:' + c + '"></div>');
  });
  part.push('</div>');

  part.push('<div class="pop-head">填充</div><div class="sp-swatches">');
  part.push('<div class="sp-sw none' + (!st.bg ? ' on' : '') + '" data-bg=""></div>');
  BG_COLORS.forEach(c => {
    part.push('<div class="sp-sw' + (st.bg === c ? ' on' : '') +
              '" data-bg="' + c + '" style="background:' + c + '"></div>');
  });
  part.push('</div>');

  stylePop.innerHTML = part.join('');

  stylePop.querySelectorAll('[data-fs]').forEach(b => {
    b.onclick = () => setNodeStyle(id, 'fs', b.dataset.fs === 'm' ? null : b.dataset.fs);
  });
  stylePop.querySelectorAll('[data-shape]').forEach(b => {
    b.onclick = () => setNodeStyle(id, 'shape', b.dataset.shape === 'round' ? null : b.dataset.shape);
  });
  stylePop.querySelectorAll('[data-color]').forEach(b => {
    b.onclick = () => setNodeStyle(id, 'color', b.dataset.color || null);
  });
  stylePop.querySelectorAll('[data-bg]').forEach(b => {
    b.onclick = () => setNodeStyle(id, 'bg', b.dataset.bg || null);
  });
}

function setNodeStyle(id, key, val){
  const n = findNode(id);
  if(!n) return;
  pushUndo();
  n.style = n.style || {};
  if(val === null || val === undefined || n.style[key] === val) delete n.style[key];
  else n.style[key] = val;
  if(!Object.keys(n.style).length) n.style = null;
  touch();
  render();
  buildStylePop(id);
  lastStylePos && placePop(stylePop, lastStylePos.x, lastStylePos.y);
}

function placePop(pop, x, y){
  pop.classList.add('open');
  const r = pop.getBoundingClientRect();
  pop.style.left = Math.min(x, innerWidth - r.width - 12) + 'px';
  pop.style.top  = Math.min(y, innerHeight - r.height - 12) + 'px';
}

function openStylePanel(id, x, y){
  hideMenu();
  structPop.classList.remove('open');
  lastStylePos = { x, y };
  buildStylePop(id);
  placePop(stylePop, x, y);
}

document.addEventListener('pointerdown', (e) => {
  if(!stylePop.contains(e.target)) stylePop.classList.remove('open');
}, true);

/* =====================================================================
   12.3 全局搜索
   ===================================================================== */
const findBar = $('#findBar'), findInput = $('#findInput');

S.hitSet = null;
S.hitCur = null;
S.hits = [];
S.hitIdx = -1;

function nodeMatches(n, q){
  if(!q) return false;
  if((n.text || '').toLowerCase().indexOf(q) >= 0) return true;
  if((n.note || '').toLowerCase().indexOf(q) >= 0) return true;
  if((n.labels || []).join(' ').toLowerCase().indexOf(q) >= 0) return true;
  if((n.markers || []).some(id => {
        const d = MARKER_MAP[id];
        return d && (d.name.toLowerCase().indexOf(q) >= 0);
      })) return true;
  return false;
}

function runFind(keepIndex){
  const q = findInput.value.trim().toLowerCase();
  const all = allNodes();
  S.hits = q ? all.filter(n => nodeMatches(n, q)) : [];
  S.hitSet = new Set(S.hits.map(n => n.id));
  S.outlineFilter = q;

  if(!S.hits.length){
    S.hitIdx = -1;
    S.hitCur = null;
    $('#findCount').textContent = q ? '无结果' : '';
  }else{
    if(!keepIndex || S.hitIdx < 0 || S.hitIdx >= S.hits.length) S.hitIdx = 0;
    S.hitCur = S.hits[S.hitIdx].id;
    $('#findCount').textContent = (S.hitIdx + 1) + '/' + S.hits.length;
  }
  $('#findPrev').disabled = S.hits.length < 2;
  $('#findNext').disabled = S.hits.length < 2;
  render();
  if(S.outlineOn) buildOutline(true);
  if(S.hits.length) revealHit();
}

function revealHit(){
  if(S.hitIdx < 0 || !S.hits[S.hitIdx]) return;
  const n = S.hits[S.hitIdx];
  // 命中节点若被折叠，展开其祖先
  let p = findParent(n.id), guard = 0;
  while(p && guard++ < 40){
    if(p.collapsed){ p.collapsed = false; }
    p = findParent(p.id);
  }
  S.sel = n.id;
  render();
  setTimeout(() => centerOn(n.id), 20);
}

function stepHit(dir){
  if(!S.hits.length) return;
  S.hitIdx = (S.hitIdx + dir + S.hits.length) % S.hits.length;
  S.hitCur = S.hits[S.hitIdx].id;
  $('#findCount').textContent = (S.hitIdx + 1) + '/' + S.hits.length;
  render();
  revealHit();
  if(S.outlineOn) buildOutline(true);
}

function openFind(){
  findBar.classList.add('on');
  findInput.focus();
  findInput.select();
}

function closeFind(){
  findBar.classList.remove('on');
  findInput.value = '';
  S.hits = []; S.hitSet = null; S.hitCur = null; S.hitIdx = -1;
  S.outlineFilter = '';
  render();
  if(S.outlineOn) buildOutline(true);
}

findInput.addEventListener('input', () => runFind(false));
findInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); stepHit(e.shiftKey ? -1 : 1); }
  else if(e.key === 'Escape'){ e.preventDefault(); closeFind(); }
});
$('#findPrev').onclick = () => stepHit(-1);
$('#findNext').onclick = () => stepHit(1);
$('#findClose').onclick = closeFind;
